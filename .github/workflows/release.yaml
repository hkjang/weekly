name: Offline Docker Release

on:
  push:
    tags: ["v*"]
  # A tag push is the only way this ran, so a run that never starts — a stuck
  # queue, a cancelled job — left a tag with no release and no way back except
  # rewriting the tag. Rewriting a published ref to fix a pipeline is a bad
  # trade. This lets the same tag be built again without touching it.
  workflow_dispatch:
    inputs:
      tag:
        description: "다시 만들 릴리스 태그 (예: v0.150.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Named once for the whole job. A dispatch runs on a branch, so
      # github.ref_name is the branch and every step that reads it would build
      # the wrong thing.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # And the source has to be the tag's, not the branch the dispatch ran
          # from — otherwise VERSION and the release notes come from wherever
          # main happens to be.
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release metadata
        run: |
          version="${RELEASE_TAG#v}"
          test "$(cat VERSION)" = "$version" || { printf '::error::VERSION과 태그가 일치하지 않습니다.\n'; exit 1; }
          test -s ".github/release-notes/${RELEASE_TAG}.md" || { printf '::error::상세 릴리즈 본문이 없습니다.\n'; exit 1; }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify source
        run: |
          go test ./...
          go vet ./...
          npm --prefix frontend ci
          npm --prefix frontend run lint
          # Half of what is being published is the frontend, and until now the
          # release ran its linter but never its tests. CI ran them, which is
          # the gate for merging — this is the gate for publishing, and the two
          # came apart once already: v0.158.0 shipped while CI was red.
          npm --prefix frontend test
          # CI runs these too, but CI and this workflow start at the same moment
          # on the same push: no check in CI can stop a publish. Anything that
          # decides whether what is being published is correct has to run here.
          #
          # The deployment files carry the image tag an operator will pull, the
          # documentation ships beside the archive, and the frontend invariant
          # is about the same build. The slow test-quality checks stay in CI —
          # they judge the tests, not the artefact.
          sh scripts/version-check.sh
          python3 scripts/openapi-check.py
          python3 scripts/modal-close-check.py
      - uses: docker/setup-buildx-action@v4
      - name: Build offline image
        run: |
          version="${RELEASE_TAG#v}"
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION="$version" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$RELEASE_TAG" \
            -t "weekly:$RELEASE_TAG" .
          mkdir -p release
          docker save "weekly:$RELEASE_TAG" | gzip -9 -n > "release/weekly-${RELEASE_TAG}.tar.gz"
          checksum=$(sha256sum "release/weekly-${RELEASE_TAG}.tar.gz" | cut -d ' ' -f1)
          printf 'OFFLINE_SHA256=%s\n' "$checksum" >> "$GITHUB_ENV"
          printf 'OFFLINE_ASSET=release/weekly-%s.tar.gz\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_source=".github/release-notes/${RELEASE_TAG}.md"
          if [ ! -s "$notes_source" ]; then
            printf '::error::상세 릴리즈 본문이 없습니다: %s\n' "$notes_source"
            exit 1
          fi
          cp "$notes_source" release/release-notes.md
          asset_name=$(basename "$OFFLINE_ASSET")
          asset_size=$(stat -c '%s' "$OFFLINE_ASSET")
          identity_dir=$(mktemp -d)
          gzip -dc "$OFFLINE_ASSET" | tar -x -C "$identity_dir" manifest.json
          image_id="sha256:$(grep -o 'blobs/sha256/[0-9a-f]\{64\}' "$identity_dir/manifest.json" | head -1 | sed 's#.*/##')"
          rm -rf "$identity_dir"
          {
            printf '\n## 오프라인 배포 자산\n\n'
            printf -- '- 파일: `%s`\n' "$asset_name"
            printf -- '- 크기: `%s bytes`\n' "$asset_size"
            printf -- '- SHA-256: `%s`\n' "$OFFLINE_SHA256"
            printf -- '- 이미지 다이제스트: `%s`\n' "$image_id"
            printf '\n반입 전에는 파일이 온전히 도착했는지를 SHA-256으로, 그 파일이 담은 것이 빌드된 이미지가 맞는지를 아카이브 안의 다이제스트로 확인합니다. 옮기는 과정에서 압축을 풀었다 다시 묶으면 파일 해시는 달라지지만 다이제스트는 그대로입니다. `docker image inspect --format {{.Id}}` 는 이 값과 다를 수 있습니다 — Docker가 적재하면서 자기 식별자를 다시 매기기 때문이며, 확인에 쓰지 마십시오.\n'
            printf '\n```bash\nsha256sum %s\ngzip -dc %s | tar -xO manifest.json | grep -o "blobs/sha256/[0-9a-f]\\{64\\}" | head -1\ngzip -dc %s | docker load\n```\n' "$asset_name" "$asset_name" "$asset_name"
          } >> release/release-notes.md
          gh release create "${RELEASE_TAG}" "$OFFLINE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Weekly ${RELEASE_TAG}" \
            --notes-file release/release-notes.md
