name: Offline Docker Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build offline image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION="$version" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$version" \
            -t "weekly:$version" .
          mkdir -p release
          docker save "weekly:$version" | gzip -9 -n > "release/weekly-v${version}-linux-amd64-docker.tar.gz"
          checksum=$(sha256sum "release/weekly-v${version}-linux-amd64-docker.tar.gz" | cut -d ' ' -f1)
          printf 'OFFLINE_SHA256=%s\n' "$checksum" >> "$GITHUB_ENV"
          printf 'OFFLINE_ASSET=release/weekly-v%s-linux-amd64-docker.tar.gz\n' "$version" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "$OFFLINE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "오프라인 이미지 SHA-256: \`$OFFLINE_SHA256\`"
