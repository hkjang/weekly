name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Without a database every integration test skips, and a skipped test is not
    # a passing one. The migrations, the participation window and the search
    # ranking were all verified only on somebody's laptop until this existed.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: weekly
          POSTGRES_DB: weeklytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WEEKLY_TEST_POSTGRES_DSN: postgres://postgres:weekly@127.0.0.1:5432/weeklytest?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          # The mutation step below diffs against the previous commit.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test ./...
      - run: go vet ./...
      # A guard that never runs its subject passes whatever the subject does.
      # Three releases in a row shipped one before this check existed.
      - run: python3 scripts/guard-check.py
      - run: python3 scripts/modal-close-check.py
      # Every release note since v0.15 tells operators to back up before
      # upgrading. Until this step, nothing had ever run the script they were
      # being told to trust.
      - run: sh scripts/backup-check.sh
      - run: sh scripts/version-check.sh
      - run: python3 scripts/openapi-check.py
      # guard-check answers "did this test run its subject". mutation-check
      # answers the harder question, and running it over every guard takes
      # hours. It does not have to: a guard that cannot fail is nearly always
      # a new one — either the subject grew a branch nobody checks, or the
      # guard itself was just written — and both are in the diff.
      #
      # A surviving mutation is a question, not a verdict; some are
      # semantically harmless. So this reports and never blocks.
      - run: python3 scripts/mutation-check.py --changed "${{ github.event.pull_request.base.sha || github.event.before }}" --budget 480
        continue-on-error: true
      - run: npm ci && npm run build
        working-directory: frontend
      # Half the product is the frontend and none of it had executable
      # verification. presentSlides decides what a presenter puts on a screen in
      # a meeting — the same deliverable the PPTX export is.
      - run: npm test
        working-directory: frontend
      - run: docker build --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) -t weekly:ci .
