services:
  weekly:
    image: weekly:v${WEEKLY_VERSION:-0.288.0}
    container_name: weekly
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      WEEKLY_POSTGRES_DSN: ${WEEKLY_POSTGRES_DSN:?required}
      # Not :?required either. These are needed only by a database with no
      # administrator in it. Demanding them here would refuse to render for
      # every deployment that has already had its first boot and has since
      # taken the first administrator's password back out of its .env — which
      # is what the guide now tells operators to do. A genuine first install
      # that forgets them is refused by the process, with a message naming
      # the two variables.
      WEEKLY_BOOTSTRAP_ADMIN: ${WEEKLY_BOOTSTRAP_ADMIN:-}
      WEEKLY_BOOTSTRAP_ADMIN_PASSWORD: ${WEEKLY_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Not :?required. The product supports running without it — the key then
      # lives only in the state volume — and README documents that mode and the
      # upgrade path out of it. Demanding it here refused to render at all for
      # the .env.example this repository ships, and locked out every existing
      # deployment whose key is in its volume. The nudge belongs where it can
      # explain itself: the startup log says the key lives only in the volume
      # and asks for this variable so an upgrade survives losing it.
      WEEKLY_ENCRYPTION_KEY: ${WEEKLY_ENCRYPTION_KEY:-}
      WEEKLY_ALLOW_SECRET_RESET: ${WEEKLY_ALLOW_SECRET_RESET:-false}
    # Same reasoning as deploy/kubernetes.yaml: the password queue sizes
    # itself to this limit at startup and logs what it chose. Without a limit
    # the container inherits the host's memory, which is fine until the host
    # is shared.
    mem_limit: 1g
    cpus: 2
    volumes:
      - weekly-data:/var/lib/weekly
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long enough to cover migrations on a first boot against existing data.
      start_period: 120s

volumes:
  weekly-data:
