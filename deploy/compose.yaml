services:
  weekly:
    image: weekly:v${WEEKLY_VERSION:-0.116.0}
    container_name: weekly
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      WEEKLY_POSTGRES_DSN: ${WEEKLY_POSTGRES_DSN:?required}
      WEEKLY_BOOTSTRAP_ADMIN: ${WEEKLY_BOOTSTRAP_ADMIN:?required}
      WEEKLY_BOOTSTRAP_ADMIN_PASSWORD: ${WEEKLY_BOOTSTRAP_ADMIN_PASSWORD:?required}
      WEEKLY_ENCRYPTION_KEY: ${WEEKLY_ENCRYPTION_KEY:?required}
      WEEKLY_ALLOW_SECRET_RESET: ${WEEKLY_ALLOW_SECRET_RESET:-false}
    # Same reasoning as deploy/kubernetes.yaml: the password queue sizes
    # itself to this limit at startup and logs what it chose. Without a limit
    # the container inherits the host's memory, which is fine until the host
    # is shared.
    mem_limit: 1g
    cpus: 2
    volumes:
      - weekly-data:/var/lib/weekly
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long enough to cover migrations on a first boot against existing data.
      start_period: 120s

volumes:
  weekly-data:
