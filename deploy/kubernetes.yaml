apiVersion: v1
kind: Secret
metadata:
  name: weekly-bootstrap
type: Opaque
stringData:
  WEEKLY_POSTGRES_DSN: "postgres://weekly:CHANGE_ME@postgres.internal:5432/weekly?sslmode=require"
  WEEKLY_BOOTSTRAP_ADMIN: "admin"
  WEEKLY_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_AT_LEAST_12_CHARS"
  # 필수. `openssl rand -base64 32` 결과로 교체하고 모든 업그레이드에서 유지합니다.
  # 이 값을 잃으면 저장된 OIDC/AI/Confluence 비밀 설정을 복호화할 수 없습니다.
  WEEKLY_ENCRYPTION_KEY: "CHANGE_ME_BASE64_32_BYTE_KEY"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weekly-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weekly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weekly
  template:
    metadata:
      labels:
        app: weekly
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weekly
          image: weekly:v0.19.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: weekly-bootstrap
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/weekly
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weekly-data
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weekly
spec:
  selector:
    app: weekly
  ports:
    - port: 8080
      targetPort: http
