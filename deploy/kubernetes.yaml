apiVersion: v1
kind: Secret
metadata:
  name: weekly-bootstrap
type: Opaque
stringData:
  WEEKLY_POSTGRES_DSN: "postgres://weekly:CHANGE_ME@postgres.internal:5432/weekly?sslmode=require"
  WEEKLY_BOOTSTRAP_ADMIN: "admin"
  WEEKLY_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_AT_LEAST_12_CHARS"
  # 필수. `openssl rand -base64 32` 결과로 교체하고 모든 업그레이드에서 유지합니다.
  # 이 값을 잃으면 저장된 OIDC/AI/Confluence 비밀 설정을 복호화할 수 없습니다.
  WEEKLY_ENCRYPTION_KEY: "CHANGE_ME_BASE64_32_BYTE_KEY"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weekly-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weekly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weekly
  template:
    metadata:
      labels:
        app: weekly
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weekly
          image: weekly:v0.174.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: weekly-bootstrap
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/weekly
            - name: temporary
              mountPath: /tmp
          # Startup is separated from liveness on purpose. A first boot against a
          # large existing corpus has migrations to apply before it can answer,
          # and the default liveness probe kills a pod after roughly 30 seconds
          # of silence — which restarts the work rather than waiting for it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # Memory is sized by what password hashing reserves, which is the
          # only part of this service that holds a large block for the length
          # of a request. Argon2id takes 64 MiB per verification, and the
          # process queues them so the peak is bounded: it reads this limit at
          # startup, sizes the queue to fit, and logs the figure it chose
          # ("password hashing pool sized").
          #
          # Measured on 300 people, 52 weeks, 109,200 report items, with 300
          # sessions signing in and working at once:
          #
          #   512Mi / 1 CPU  -> 5 slots, survives, 48.8s for the burst
          #   1Gi   / 2 CPU  -> 8 slots, survives, 31.3s for the burst
          #
          # 512Mi is enough and 1Gi is the default here because Monday morning
          # is the minute this service is judged on. Lowering it is safe and
          # signs people in more slowly; the queue is what keeps that a delay
          # rather than an outage.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weekly-data
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weekly
spec:
  selector:
    app: weekly
  ports:
    - port: 8080
      targetPort: http
