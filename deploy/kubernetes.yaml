apiVersion: v1
kind: Secret
metadata:
  name: weekly-bootstrap
type: Opaque
stringData:
  WEEKLY_POSTGRES_DSN: "postgres://weekly:CHANGE_ME@postgres.internal:5432/weekly?sslmode=require"
  # 아래 2개는 관리자가 없는 첫 기동에만 필요합니다. 최초 관리자가 만들어지면
  # 두 줄을 지우고 Secret 을 다시 적용하십시오. 이후 기동에는 읽히지 않습니다.
  WEEKLY_BOOTSTRAP_ADMIN: "admin"
  WEEKLY_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_AT_LEAST_12_CHARS"
  # 필수. `openssl rand -base64 32` 결과로 교체하고 모든 업그레이드에서 유지합니다.
  # 이 값을 잃으면 저장된 OIDC/AI/Confluence 비밀 설정을 복호화할 수 없습니다.
  WEEKLY_ENCRYPTION_KEY: "CHANGE_ME_BASE64_32_BYTE_KEY"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weekly-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weekly
spec:
  replicas: 1
  # 한 프로세스만 돌아야 합니다. 기본 전략인 RollingUpdate 는 replicas 가 1
  # 이어도 새 파드를 먼저 띄운 뒤 옛 파드를 내리므로, 업그레이드하는 동안
  # 잠깐 둘이 겹칩니다.
  #
  # 두 대를 같은 데이터베이스에 붙여 재현했습니다. 새 프로세스는 기동하면서
  # 중단된 작업을 되살리려고 PROCESSING 인 Import 를 PENDING 으로 돌리는데,
  # 그 작업은 중단된 것이 아니라 옛 프로세스가 붙들고 있던 것입니다. 되돌린
  # 직후 새 프로세스가 스스로 그것을 집어 가, 같은 PPTX 를 두 프로세스가
  # 동시에 AI 로 분석했습니다 — 게이트웨이에 연결 두 개, 같은 행에 두 번
  # 쓰기, 그리고 started_at 은 일을 하지 않는 쪽의 시각으로 덮였습니다.
  # Confluence 동기화도 같은 모양의 기동 복구를 갖고 있습니다.
  #
  # ReadWriteOnce 볼륨도 같은 답을 가리킵니다. 새 파드가 다른 노드에 잡히면
  # 옛 파드가 볼륨을 놓을 때까지 붙지 못해 롤아웃이 멈춥니다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weekly
  template:
    metadata:
      labels:
        app: weekly
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weekly
          image: weekly:v0.281.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: weekly-bootstrap
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/weekly
            - name: temporary
              mountPath: /tmp
          # Startup is separated from liveness on purpose. A first boot against a
          # large existing corpus has migrations to apply before it can answer,
          # and the default liveness probe kills a pod after roughly 30 seconds
          # of silence — which restarts the work rather than waiting for it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # Memory is sized by two things that hold a large block for the length
          # of a request.
          #
          # Argon2id takes 64 MiB per verification, and the process queues them
          # so the peak is bounded: it reads this limit at startup, sizes the
          # queue to fit, and logs the figure it chose ("password hashing pool
          # sized").
          #
          # Measured on 300 people, 52 weeks, 109,200 report items, with 300
          # sessions signing in and working at once:
          #
          #   512Mi / 1 CPU  -> 5 slots, survives, 48.8s for the burst
          #   1Gi   / 2 CPU  -> 8 slots, survives, 31.3s for the burst
          #
          # The second is a PPTX export of a report carrying screen captures.
          # The images are read one at a time, but the finished package is held
          # whole to send it, so the peak is about 3.5x the attachments on that
          # report. Measured: 20 captures totalling 44.9 MB took the container
          # from 78 MiB to 235 MiB. At the shipped limits — attachment.max_per_
          # report 20 and attachment.max_file_mb 10 — one export can therefore
          # ask for roughly 700 MB, and that is per person exporting.
          #
          # 1Gi survives Monday morning and one such export, not both at once
          # and not two exports at once. A deployment that lets people attach
          # ten-megabyte captures should either raise this limit or lower those
          # two settings; the admin screen states the same arithmetic.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weekly-data
        - name: temporary
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weekly
spec:
  selector:
    app: weekly
  ports:
    - port: 8080
      targetPort: http
