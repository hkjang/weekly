openapi: 3.1.0
info:
  title: Weekly API
  version: 0.28.0
  description: 주간보고 작성·복제, 근거 검증형 Confluence 6.9.1 자동 초안, 원자 사실 AI 구조화, PPTX Import, 관리자 설정, 분석 및 키 관리 REST API
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /version:
    get:
      security: []
      summary: 빌드 버전 조회
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /auth/providers:
    get:
      security: []
      summary: 로그인 방식과 공개 서비스 정보
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /auth/login:
    post:
      security: []
      summary: 로컬 로그인
      description: |
        실패가 auth.max_login_attempts에 이르면 auth.lockout_minutes 동안 그 계정의 로그인을
        429 TOO_MANY_ATTEMPTS로 거부한다. 차단 중에는 올바른 비밀번호도 거부된다.
        Retry-After 헤더에 남은 시간을 초 단위로 담는다. 실패 응답은 계정이 있든 없든 같다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me:
    get:
      summary: 현재 사용자와 서비스 컨텍스트
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/current:
    get:
      summary: 현재 주차 본인 보고서
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/previous:
    get:
      summary: 직전 보고서의 차주 계획
      description: |
        작성 중인 주차보다 앞선 본인의 가장 최근 보고서에서 항목별 차주 계획을 반환합니다.
        직전 주차가 아니라 직전 보고서를 기준으로 하므로 휴가 등으로 한 주를 건너뛰어도 계획이 이어집니다.
        `matchKey`는 제목을 소문자화하고 공백을 제거한 값으로, 아직 저장되지 않아 식별자가 없는 항목과 짝지을 때 사용합니다.
        `carryOver`는 계획이 있고 진척도가 100% 미만인 항목, 즉 아직 남아 있는 계획을 표시합니다.
        직전 보고서가 없으면 `data`가 `null`입니다.
      parameters:
        - name: weekStart
          in: query
          schema: { type: string, format: date }
          description: 기준 주차 시작일. 생략하면 현재 주차
      responses:
        "200":
          description: 직전 보고서의 계획
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: [object, "null"]
                        properties:
                          reportId: { type: integer, format: int64 }
                          weekStart: { type: string, format: date }
                          status: { type: string }
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                workItemId: { type: integer, format: int64 }
                                category: { type: string }
                                title: { type: string }
                                matchKey: { type: string }
                                nextPlan: { type: string }
                                issue: { type: string }
                                progress: { type: integer }
                                carryOver: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
  /reports/quality:
    post:
      summary: 작성 중인 보고서의 품질 점검
      description: |
        저장된 사본이 아니라 요청 본문의 초안을 점검한다. 점검은 저장 전에 가장 쓸모 있고,
        저장된 것만 볼 수 있는 점검은 작성자가 이미 지나간 버전에 대해 답하게 된다.

        규칙은 결정적이며 모델을 쓰지 않는다. AI Gateway가 꺼진 환경에서도 동작한다.
        본인 이력만 근거로 삼으며 최근 26주를 본다. 점검 대상 주차의 저장본은 근거에서 제외한다.

        - PROGRESS_REGRESSED: 지난주보다 낮은 진척도
        - PLAN_REPEATED: 같은 차주 계획을 2주 이상 반복하면서 진척도도 오르지 않음
        - PLAN_WITHOUT_RESULT: 지난주 계획이 있는데 이번 주 실적이 비어 있음
        - ISSUE_PERSISTED: 같은 이슈가 rollup.persistent_issue_weeks 이상 지속
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                weekStart: { type: string, format: date, description: 생략하면 현재 주차 }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/ReportItem" }
      responses:
        "200":
          description: 점검 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          week: { type: string, format: date }
                          checked: { type: integer }
                          findings:
                            type: array
                            items:
                              type: object
                              properties:
                                rule: { type: string }
                                severity: { type: string, enum: [WARN, INFO] }
                                title: { type: string }
                                message: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /reports/current/candidates:
    get:
      summary: 현재 주차 Confluence 자동 초안과 Sync 상태
      responses:
        "200":
          description: 사용자별 자동 초안
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          weekStart: { type: string, format: date }
                          candidates:
                            type: array
                            items: { $ref: "#/components/schemas/ConfluenceCandidate" }
  /report-candidates/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      summary: 본인 Confluence 자동 초안 수정 및 사용자 수정 보호
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfluenceCandidateWrite" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: 본인 자동 초안을 제외하고 같은 주차 재생성 방지
      responses:
        "204": { description: 제외 완료 }
        "404": { $ref: "#/components/responses/Error" }
  /report-candidates/{id}/sources:
    get:
      summary: 본인 자동 초안의 Confluence 원본 Page 목록
      parameters:
        - { $ref: "#/components/parameters/ID" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /report-candidates/accept:
    post:
      summary: 자동 초안을 저장한 본인 보고서에 연결
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, reportId]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, format: int64 }
                reportId: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /team/reports:
    get:
      summary: 조직 구성원 보고서 목록, 팀장 이상
      description: |
        조회 권한 범위의 보고서를 `/reports`와 같은 형식으로 반환한다.
        `{items, total, limit, offset}`이며 limit 기본 200, 최대 500이다.

        담당자 목록을 만들 목적으로 쓰지 말 것. 이 응답은 한 쪽일 뿐이라 최근에
        보고한 사람만 담긴다. 사람 목록은 `/team/members`에 있다.
      parameters:
        - { in: query, name: weekStart, schema: { type: string, format: date } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/ReportStatus" } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /team/members:
    get:
      summary: 인수인계·조회 대상 담당자 목록, 팀장 이상
      description: |
        이 사용자가 업무를 열어 볼 수 있는 사람을 반환한다. id, displayName,
        organizationName, active, lastWeek(마지막 보고 주차, 없으면 빈 문자열).

        **비활성 계정도 포함한다.** 인수인계 화면이 쓰는 목록이고, 넘겨받아야 할
        업무를 남긴 사람은 대개 이미 떠난 사람이다. 이전에는 이 목록을 팀 보고서
        한 쪽에서 만들어서, 최근 5주 안에 보고하지 않은 사람은 고를 수 없었다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /reports:
    get:
      summary: 권한 범위 보고서 검색
      description: |
        **응답은 배열이 아니라 `{items, total, limit, offset}` 객체다.** 이전에는 배열을
        그대로 돌려주면서 SQL에 `LIMIT 500`만 걸려 있었다. 담당자 120명·26주에서
        보고서 3,120건이 500건으로 잘려 나갔고 응답에는 잘렸다는 표시가 없었다.

        limit 기본값 200, 최대 500. 범위를 벗어나면 잘라 맞추고, 읽을 수 없는 값은
        기본값으로 본다. offset으로 다음 쪽을 가져온다. 정렬은 주차 내림차순, 이름,
        보고서 식별자 순이며 마지막 항목이 쪽 사이의 순서를 고정한다.
      parameters:
        - { in: query, name: weekStart, schema: { type: string, format: date } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/ReportStatus" } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: 보고서 생성
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportWrite" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
  /reports/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      summary: 보고서 상세
      responses:
        "200": { $ref: "#/components/responses/Success" }
    put:
      summary: 본인 보고서 낙관적 잠금 수정
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportWrite" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: 본인 보고서 낙관적 잠금 삭제
      parameters:
        - in: query
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: 삭제 완료 }
        "409": { $ref: "#/components/responses/Error" }
  /reports/{id}/submit:
    post:
      summary: 보고서 제출 또는 즉시 확정
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/{id}/clone:
    post:
      summary: 본인 보고서를 새 주차의 독립된 초안으로 복제
      description: 승인 이력, 댓글, 외부 출처 연결과 원본 항목 ID는 복사하지 않는다. 대상 주차가 없으면 현재 주차를 사용한다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetWeekStart: { type: string, format: date, description: 관리자가 설정한 주차 시작 요일이어야 함 }
                mode: { type: string, enum: [STRUCTURE, FULL], default: STRUCTURE }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /reports/{id}/approve:
    post:
      summary: 제출 보고서 승인
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/{id}/reject:
    post:
      summary: 제출 보고서 반려
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/{id}/attachments:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      summary: 보고서 화면 캡처 목록
      description: |
        각 항목의 `available`은 저장된 이미지 파일을 읽을 수 있는지를 나타낸다.

        이미지 정보는 PostgreSQL에, 파일은 `/var/lib/weekly` 상태 볼륨에 나뉘어 저장되므로
        볼륨을 유지하지 않고 업그레이드하면 항목은 남고 파일만 사라진다. 이 경우 `available`이
        false가 되며 해당 이미지는 내보내기와 발표에서 제외된다. 다시 첨부해야 복구된다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: 화면 캡처 이미지 첨부, 본인 보고서만
      description: multipart/form-data. `files`에 PNG, JPEG, GIF를 담고 `placement`로 본문 앞뒤를 지정한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                placement: { type: string, enum: [BEFORE, AFTER], default: AFTER }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /reports/{id}/attachments/{attachmentId}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { in: path, name: attachmentId, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 첨부 이미지 원본
      description: |
        404는 두 가지 원인을 구분해 반환한다. `ATTACHMENT_NOT_FOUND`는 해당 보고서에 그
        항목이 없는 경우이고, `ATTACHMENT_FILE_MISSING`은 항목은 있으나 저장된 파일이 없는
        경우다. 후자는 상태 볼륨이 유실된 상황이며 이미지를 다시 첨부해야 한다.
      responses:
        "200":
          description: 이미지 바이트
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: 캡처 설명, 삽입 위치와 순서 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: { type: string, maxLength: 240 }
                placement: { type: string, enum: [BEFORE, AFTER] }
                sortOrder: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      summary: 첨부 이미지 삭제
      responses:
        "204": { description: 삭제 완료 }
        "403": { $ref: "#/components/responses/Error" }
  /reports/{id}/export.pptx:
    get:
      summary: 템플릿 기반 PPTX 다운로드, 첨부한 화면 캡처를 본문 앞뒤 슬라이드로 포함
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: PowerPoint 파일
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
  /ai/reports/parse-text:
    post:
      summary: 자유 텍스트를 저장하지 않고 주간보고 미리보기로 구조화
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 200000 }
      responses:
        "200":
          description: 검증된 AI 미리보기
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AIWeeklyResult" }
        "503": { $ref: "#/components/responses/Error" }
  /import/pptx:
    post:
      summary: 과거 PPTX 다중 업로드 및 비동기 분석 작업 생성
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "503": { $ref: "#/components/responses/Error" }
  /import/history:
    get:
      summary: 본인의 PPTX Import 작업 이력
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /import/{id}:
    get:
      summary: 본인의 Import 작업과 파일별 분석 미리보기
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Import 작업 상세
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/Error" }
  /import/{id}/analyze:
    post:
      summary: 보관 원본이 있는 미확정 PPTX 파일 재분석
      description: 본문을 생략하면 기존 동작과 같이 실패 파일 전체를 재시도한다. fileIds를 지정하면 해당 작업에서 원본이 남은 FAILED, READY 또는 NEEDS_REVIEW 파일만 최신 파이프라인으로 재분석한다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fileIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: integer, format: int64, minimum: 1 }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /import/{id}/confirm:
    post:
      summary: 사용자가 수정한 과거 보고 미리보기 확정
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/ImportConfirmFile" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /keys:
    get:
      summary: 개인 API 키 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: 개인 API 키 발급
      responses:
        "201": { $ref: "#/components/responses/Success" }
  /keys/rotate:
    post:
      summary: 개인 키 버전 회전 및 전부 폐기
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /search:
    get:
      summary: 권한 범위 보고서 내용 검색
      description: |
        업무 제목·구분, 주간 요약, 실적, 계획, 이슈 본문을 대소문자 구분 없이 검색한다.
        여러 단어는 AND로 결합하며 일반 사용자는 본인, 팀장·조직장은 하위 조직, 관리자는 전체를 대상으로 한다.
        일치한 위치의 문장을 스니펫으로 함께 반환한다.

        정확 일치 결과가 5건 미만이면 다음 단계를 이어서 수행한다. 각 단계는 앞 단계가
        이미 찾은 보고서를 건너뛴다.

        1. pg_trgm이 설치돼 있으면 word_similarity로 표기가 비슷한 보고서를 찾고
           응답의 fuzzy를 true로, 해당 hit의 approximate를 true로 표시한다.
        2. pgvector가 설치되고 임베딩 모델이 설정돼 있으면 코사인 거리로 의미가 가까운
           보고서를 찾고 응답의 semantic을, 해당 hit의 semantic을 true로 표시한다.

        두 확장이 모두 없으면 1단계 정확 일치만 수행하며 기존 동작과 같다.
      parameters:
        - { name: q, in: query, required: true, description: "2자 이상. 공백으로 나눈 단어는 최대 6개까지 사용한다.", schema: { type: string } }
      responses:
        "200":
          description: 검색 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          query: { type: string }
                          terms: { type: array, items: { type: string } }
                          truncated: { type: boolean, description: 결과가 많아 일부만 반환했는지 }
                          fuzzy: { type: boolean, description: 표기 유사 단계가 결과에 포함됐는지 }
                          semantic: { type: boolean, description: 의미 유사 단계가 결과에 포함됐는지 }
                          hits:
                            type: array
                            items:
                              type: object
                              properties:
                                reportId: { type: integer, format: int64 }
                                weekStart: { type: string, format: date }
                                displayName: { type: string }
                                status: { $ref: "#/components/schemas/ReportStatus" }
                                score: { type: integer }
                                approximate: { type: boolean, description: 정확 일치가 아닌 유사 일치인지 }
                                semantic: { type: boolean, description: 의미 기반 일치인지 }
                                matches:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      field: { type: string }
                                      label: { type: string }
                                      title: { type: string }
                                      snippet: { type: string }
  /work-items:
    get:
      summary: 주차를 넘어 이어지는 업무와 경과 추적
      description: |
        업무별로 경과 주차, 보고 누락 주차, 진척 정체 구간, 이슈 지속 주차, 계획 반복 횟수와
        주차별 기록을 반환한다. 모든 값은 주차 스냅샷에서 파생하므로 별도 갱신이 필요 없다.
      parameters:
        - { name: scope, in: query, description: "TEAM은 팀장 이상만 조회할 수 있습니다.", schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /work-items/{id}/merge:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      summary: 잘못 나뉜 업무를 하나로 합치기
      description: |
        이 업무의 모든 주차 스냅샷을 intoId 업무로 옮기고, 이 업무는 대상 업무를 가리키는
        표시만 남긴다. 행과 정규화 키를 지우지 않는 것이 핵심이다. 업무 식별은 저장할 때마다
        제목에서 다시 유도하므로, 행을 지우면 다음 보고서가 같은 제목을 쓰는 순간 업무가
        다시 만들어져 합친 결과가 사라진다.

        본인 업무만 정리할 수 있으며 관리자는 대신 수행할 수 있다. 팀장은 할 수 없다.
        보고서를 검토하는 권한과 남의 이력을 고쳐 쓰는 권한은 다르다.
        담당자가 서로 다른 업무끼리는 합칠 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intoId]
              properties:
                intoId: { type: integer, format: int64, description: 합칠 대상 업무 }
      responses:
        "200":
          description: 합친 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          workItemId: { type: integer, format: int64 }
                          movedItems: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /work-items/{id}/split:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      summary: 하나로 잘못 묶인 업무에서 일부 주차를 떼어내기
      description: |
        선택한 주차 스냅샷을 새 제목의 업무로 옮기고 그 연결을 고정한다. 고정하지 않으면
        해당 보고서를 다시 저장할 때 제목에서 유도한 원래 업무로 되돌아간다. 고정은 제목이
        그대로인 동안만 유지된다. 제목을 바꾸는 것은 업무가 무엇인지에 대한 진술이므로 그때는
        다시 유도하는 편이 맞다.

        모든 주차를 옮기는 것은 분리가 아니라 이름 변경이므로 거부한다. 이름만 바꾸려면
        보고서에서 업무 제목을 수정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, reportItemIds]
              properties:
                title: { type: string, maxLength: 240 }
                category: { type: string, maxLength: 80 }
                reportItemIds:
                  type: array
                  items: { type: integer, format: int64 }
                  description: 업무 조회 응답의 weeks[].itemIds에서 얻는다
      responses:
        "200":
          description: 분리한 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          workItemId: { type: integer, format: int64 }
                          movedItems: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /rollups:
    get:
      summary: 월간·분기·반기·연간 기간 보고 집계
      description: |
        기간에 겹치는 주간보고를 취합해 중복 업무와 반복 기재를 제거한 업무 목록,
        완료율·정체·이슈 지속·보고 커버리지 인사이트와 주차별 추이를 반환합니다.
        저장하지 않고 요청할 때마다 원본 주간보고에서 다시 계산합니다.

        같은 업무인지는 v0.18.0부터 **저장된 WorkItem 식별자**가 결정합니다. 한 담당자 안에서는
        본인이 병합·분리한 결과가 그대로 적용되고, 제목 유사도 추측은 사용하지 않습니다.
        담당자 사이에서는 사람을 가로지르는 저장된 식별자가 없으므로 제목 유사도를 계속 사용합니다.
        기간 보고는 조직의 한 업무를 사람 수만큼이 아니라 한 줄로 보여 주기 위한 것이기 때문입니다.

        식별자가 없는 과거 행은 이전과 동일하게 제목 규칙으로 묶습니다.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [MONTH, QUARTER, HALF, YEAR], default: MONTH } }
        - { name: period, in: query, description: "2026-08, 2026-Q3, 2026-H2, 2026. 생략하면 현재 기간", schema: { type: string } }
        - { name: scope, in: query, description: "TEAM은 팀장 이상만 조회할 수 있습니다.", schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /rollups/export.csv:
    get:
      description: |
        기간 집계를 CSV로 내려받는다. 보고 본문은 사용자가 입력한 값이므로 `=`, `+`, `@`,
        탭, 캐리지리턴으로 시작하는 셀 앞에 작은따옴표를 붙여 스프레드시트가 수식으로
        실행하지 않게 한다. `-` 뒤에 공백이 오는 경우는 글머리표이므로 그대로 둔다.
      summary: 기간 보고 업무 표 CSV 내보내기
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [MONTH, QUARTER, HALF, YEAR], default: MONTH } }
        - { name: period, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200":
          description: UTF-8 BOM CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
  /rollups/export.pptx:
    get:
      summary: 기간 보고 PPTX 내보내기
      description: 표지, 경영 인사이트, 업무 현황표, 업무 상세, 이슈로 구성된 기간 보고 전용 레이아웃을 내용량에 맞춰 분면해 내보냅니다.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [MONTH, QUARTER, HALF, YEAR], default: MONTH } }
        - { name: period, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200":
          description: PPTX 파일
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
        "409": { $ref: "#/components/responses/Error" }
  /analytics/overview:
    get:
      summary: 조직 보고 현황 분석
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /analytics/endpoints:
    get:
      summary: 최근 24시간 API 분석, 관리자 전용
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /present/theme:
    get:
      summary: 발표 화면 강조색
      description: |
        조직이 올린 PPTX 템플릿의 테마에서 accent1 색을 읽어 반환한다. 내보낸 파일과 화면이
        같은 색을 쓰게 하기 위한 것이다. 지금까지 파일은 회사 템플릿을, 화면은 고정된
        파랑·청록을 써서 같은 보고가 매체에 따라 다른 회사 자료처럼 보였다.

        accent1만 읽는다. 화면 덱은 강조색 하나를 중심으로 구성돼 있어 서체와 나머지 다섯
        강조색은 놓일 자리가 없다. 템플릿을 읽을 수 없으면 accent 없이 source만 반환하고
        화면은 기본색을 유지한다. source는 TEMPLATE(관리자 업로드), REFERENCE(내장 기본),
        DEFAULT(읽지 못함)다.
      responses:
        "200":
          description: 강조색
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accent: { type: string, example: "#2563EB" }
                          source: { type: string, enum: [TEMPLATE, REFERENCE, DEFAULT] }
                          name: { type: string }
  /changes:
    get:
      summary: 지난주 대비 주간 변화 요약
      description: |
        업무별로 지난주와 이번 주 스냅샷을 비교해 완료·신규·재개·진척·진척도 역행·정체·보고 누락으로
        분류한다. AI 없이 결정적으로 계산하며, 분류 로직은 회의 모드와 **같은 함수**를 쓴다.
        화면마다 따로 구현하면 같은 업무가 한 화면에서는 완료로, 다른 화면에서는 진척으로 보이고
        읽는 사람이 둘 다 믿지 않게 된다.

        그대로 진행 중인 업무(STEADY)는 reported에는 세지만 목록에는 넣지 않는다. 이미 보고서에
        적혀 있는 내용을 요약이 다시 반복하면 요약이 아니다. 완료된 뒤 보고에서 빠진 업무는
        누락이 아니라 정상이므로 제외한다.

        분류에는 정체 주차와 미보고 주차가 필요하므로 최근 26주 이력을 함께 읽는다.
      parameters:
        - { name: week, in: query, schema: { type: string, format: date }, description: 생략하면 현재 주차 }
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200":
          description: 주간 변화
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          week: { type: string, format: date }
                          previousWeek: { type: string, format: date }
                          scope: { type: string }
                          reported: { type: integer }
                          changed: { type: integer }
                          groups:
                            type: array
                            items:
                              type: object
                              properties:
                                kind: { type: string, enum: [COMPLETED, NEW, RESUMED, PROGRESSED, REGRESSED, STALLED, SILENT] }
                                title: { type: string }
                                count: { type: integer }
                                entries: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /meeting:
    get:
      summary: 회의 모드 안건
      description: |
        해당 주차에서 회의가 다뤄야 할 것만 구획으로 나눠 반환한다. 지난주와 비교해
        달라지지 않은 업무는 포함하지 않는다.

        구획은 결정 필요(상위 조직 요청), 신규 이슈, 지속 이슈, 변경점(신규·완료·진척 변화·정체),
        보고 누락 순이며 회의가 먼저 해결해야 하는 순서를 따른다.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
        - { name: week, in: query, description: "생략하면 현재 주차", schema: { type: string, format: date } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /digest:
    get:
      summary: 경영 요약, 팀장 이상
      description: |
        조회 권한 범위의 업무 중 확인이 필요한 최대 10건을 선정한다. 점수는 관측 가능한
        사실의 합이며 각 항목은 선정 근거(grounds)를 함께 반환한다.

        **grounds는 문자열 배열이 아니라 객체 배열이다.** 각 원소는 kind(DECISION,
        ISSUE, STALLED, SILENT, DUPLICATE, DONE), text, points를 갖고, points의
        합은 score와 같다. 이전에는 총점과 문장만 있어서 어느 근거가 점수를 얼마나
        올렸는지 알 수 없었고, 항목 사이의 순위를 근거로 따질 수 없었다.

        완료 업무의 과거 이슈 이력은 위험으로 집계하지 않으며, 진척 변화 없이 매주 100%로
        보고되는 운영성 업무는 완료로 집계하지 않는다.
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 52, default: 8 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /insights/work-graph:
    get:
      summary: 조직 간 유사·중복 업무와 협업 지도, 팀장 이상
      description: |
        비교 자체는 업무 수의 제곱에 비례하지만 응답의 similar와 duplicates에는
        **관련도 상위 200건씩만** 담고, 조건에 맞는 전체 건수를 similarTotal,
        duplicateTotal로 함께 반환한다. 이전에는 모든 쌍을 담았고, 업무 1,800건에서
        234,900개 링크와 158MB 본문이 나왔다.

        collaboration은 상한과 무관하게 **조건에 맞는 모든 쌍**에서 집계한다. 조직 쌍
        단위로 묶여 원래 작기 때문이며, 상위 200건만으로 만들면 조직 쌍이 통째로 사라진
        지도를 완전한 것처럼 보여 주게 된다.

        제목 토큰 일치로 담당자가 다른 업무를 연결한다. 상투어만 겹치는 제목과 같은
        담당자의 업무는 제외한다. 판정은 모두 사람이 확인할 후보이며 확정 사실이 아니다.

        duplicates는 조직이 다르고 유사도 70 이상이며 양쪽 모두 미완료이고 보고 기간이
        겹치는 경우, similar는 유사도 50 이상의 나머지 연결이다. collaboration은 조직 쌍별
        연결 업무 수와 주제, recurring은 4주 이상·주기 60% 이상·진척 변화 10% 이하인
        운영성 업무다.
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /handover:
    get:
      summary: 담당자 인수인계 자료
      description: |
        주차 스냅샷에서 진행 경과, 이슈 이력과 해소 여부, 미해결 요청, 관련 업무를 모은다.
        진행 경과는 진척이 실제로 변한 주차만 남긴다.

        userId를 생략하면 본인 자료를 반환한다. 다른 담당자를 조회하려면 팀장 이상이어야 하며,
        조회 권한 범위 밖 담당자는 결과가 비어 있다.

        track은 보고된 주차마다 week, progress, issue를 담는다. firstWeek와 lastWeek
        사이인데 track에 없는 주차가 **보고가 누락된 주차**이며, 화면은 그 빈칸을
        그린다. milestones는 진척이 변한 주차만 남기므로 빈 구간을 표현할 수 없다.

        relatedWork는 업무마다 **최대 5건**이다. 이전에는 조직 전체의 모든 쌍을 비교한
        결과에서 대상자 것만 골라 담았고, 업무 15건짜리 자료에 관련 업무 3,915건이 실렸다.
        이제 대상자의 업무에 닿는 쌍만 비교한다.
      parameters:
        - { name: userId, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /work-items/search:
    get:
      summary: 자연어 과거 업무·사례 검색
      description: |
        업무의 전체 이력(제목, 구분, 실적, 계획, 이슈, 요청)에서 찾는다. 이슈가 사라진
        다음 주의 실적을 resolution으로 함께 반환해 해결 경과를 확인할 수 있게 한다.

        pgvector와 임베딩 모델이 설정돼 있으면 표현이 다른 업무도 함께 찾으며 해당 결과의
        semantic이 true가 된다. 확장이 없으면 문자열 일치만 사용한다.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/embeddings:
    get:
      summary: 의미 검색 임베딩 현황, 관리자 전용
      description: |
        pgvector 설치 여부, 의미 검색 활성 여부, 임베딩이 생성된 항목 수를 반환한다.
        stale은 임베딩을 만든 뒤 본문이 수정되어 갱신을 기다리는 항목 수다. 검색은 되지만
        지금은 존재하지 않는 문장으로 답하므로 별도로 센다.
        비활성 상태이면 reason에 사유를 담는다. 코사인 점수 범위는 임베딩 모델마다
        다르므로 search.semantic_threshold를 조정할 때 이 값을 기준으로 삼는다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/embeddings/rebuild:
    post:
      summary: 임베딩 일괄 생성, 관리자 전용
      description: |
        임베딩이 없거나 임베딩을 만든 뒤 본문이 수정된 보고 항목을 모두 임베딩한다.
        배경 작업이 말뭉치를 한 배치씩 훑기를 기다리지 않고 즉시 채운다.
        같은 모델로 임베딩됐고 그 뒤 수정되지 않은 항목은 다시 만들지 않는다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/analytics/keywords:
    get:
      summary: 보고 내용 키워드 분석, 관리자 전용
      description: |
        보고서 한 건을 문서 하나로 보고 용어를 추출한다. 어미와 조사를 규칙으로 제거하되
        명사의 마지막 글자일 수 있는 조사는 어근이 말뭉치에 관찰될 때만 제거하며,
        인접한 두 단어를 복합어로 함께 집계한다. 가중치는 로그 빈도에 역문서빈도를 곱한 값이다.
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
        - { name: field, in: query, schema: { type: string, enum: [ALL, TITLE, CURRENT, NEXT, ISSUE], default: ALL } }
        - { name: organizationId, in: query, description: 하위 조직 포함, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/analytics/organizations:
    get:
      summary: 조직별 제출률·완료율·이슈율 비교, 관리자 전용
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/analytics/participation:
    get:
      description: |
        제출률과 정시 제출률, 미제출 현황을 반환한다. 응답의 deadline이 정시 판정 기준이며,
        화면은 이 값을 그대로 표시한다. 정의가 보이지 않는 정시율은 저마다 다른 기준을 가정하게 만든다.

        판정은 `주차 시작일 + workflow.deadline_days일 + workflow.deadline_hour시`를 service.timezone으로
        해석한 시각과 submitted_at을 비교한다. v0.18.0 이전에는 submitted_at을 데이터베이스 세션
        시간대(UTC)로 날짜 변환해 비교했고, 그 결과 마감 다음 날 오전에 낸 보고서가 정시로 집계됐다.
      summary: 주차별 제출률·기한 내 제출률과 미제출 인원, 관리자 전용
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/audit:
    get:
      summary: 감사 이력 조회, 관리자 전용
      description: |
        감사 이력을 조건으로 조회한다. 이전에는 최근 500건을 조건 없이 반환할 뿐이어서,
        수백 명 규모에서는 며칠이면 "누가 언제 이 보고서를 승인했는지"를 답할 수 없게 됐다.

        action은 앞부분 일치이므로 `report`로 보고서 관련 작업을 모두 찾을 수 있다.
        actor는 아이디와 표시 이름 모두에 부분 일치한다. total을 함께 반환하므로 화면이
        보여 주는 것이 전부인 것처럼 오해할 여지가 없다. limit 상한은 200이다.

        `audit.retention_days`가 지난 기록은 유지보수 주기에 삭제한다. 0이면 지우지 않는다.
      parameters:
        - { name: action, in: query, schema: { type: string }, description: 앞부분 일치 }
        - { name: actor, in: query, schema: { type: string }, description: 아이디 또는 이름 부분 일치 }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date }, description: 그날을 포함 }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 감사 이력 한 쪽
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { type: object } }
                          total: { type: integer }
                          limit: { type: integer }
                          offset: { type: integer }
                          retentionDays: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /admin/settings:
    get:
      summary: 운영 설정 조회
      responses:
        "200": { $ref: "#/components/responses/Success" }
    put:
      summary: 운영 설정 변경
      description: |
        결과를 되돌리기 어려운 설정은 확인을 요구한다. `workflow.week_start`를 바꿀 때
        기존 보고서가 새 주차 격자에서 벗어나면 409 `WEEK_START_NEEDS_CONFIRMATION`과 함께
        영향 범위를 반환하고, 같은 요청에 `confirmed: ["workflow.week_start"]`를 넣어야 진행한다.

        격자를 옮기면 벗어난 보고서는 참여 분석에서 빠지고, 기간 보고에서 한 주가 두 주로
        집계될 수 있다. 전환 주에는 기존 보고서와 기간이 겹쳐 새 보고서를 만들 수 없으므로
        작성자는 기존 보고서를 열어 이어 써야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: { type: string } }
                confirmed: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/settings/ai/test:
    post:
      summary: 저장된 AI Gateway 설정의 Structured Output 연결 시험
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/settings/confluence/test:
    post:
      summary: 저장된 Confluence 6.9.1 REST 설정 연결 시험
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/confluence/sync:
    post:
      summary: 관리자 증분 동기화 비동기 요청
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/confluence/sync/status:
    get:
      summary: 동기화 상태·처리 건수·최근 오류
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/confluence/users/mappings:
    get:
      summary: Weekly와 Confluence 사용자 매핑·자동 추천 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/confluence/users/unmapped:
    get:
      summary: 활성 미매핑 사용자 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/confluence/users/{id}/mapping:
    put:
      summary: 관리자 명시 Confluence 사용자 매핑
      parameters:
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalUsername, active]
              properties:
                externalUsername: { type: string, minLength: 1, maxLength: 255 }
                active: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      summary: 사용자 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: 사용자 등록
      responses:
        "201": { $ref: "#/components/responses/Success" }
  /admin/organizations:
    get:
      summary: 조직 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: 조직 등록
      responses:
        "201": { $ref: "#/components/responses/Success" }
  /admin/pptx-template:
    get:
      summary: PPTX 템플릿 정보
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: PPTX 템플릿 업로드
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    delete:
      summary: 기본 PPTX 템플릿 복원
      responses:
        "200": { $ref: "#/components/responses/Success" }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: weekly_session }
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ID: { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
  responses:
    Success:
      description: 성공
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
  schemas:
    Envelope:
      type: object
      required: [success, traceId]
      properties:
        success: { type: boolean }
        data: {}
        error:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }
        traceId: { type: string }
    ReportStatus:
      type: string
      enum: [DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, CLOSED]
    ReportItem:
      type: object
      required: [title, currentResult, nextPlan, issue, progress]
      properties:
        category: { type: string }
        title: { type: string, maxLength: 240 }
        currentResult: { type: string }
        nextPlan: { type: string }
        issue: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
    AIReportItem:
      allOf:
        - { $ref: "#/components/schemas/ReportItem" }
        - type: object
          required: [confidence]
          properties:
            confidence: { type: number, minimum: 0, maximum: 1 }
            categoryConfidence:
              type: number
              minimum: 0
              maximum: 1
              description: 업무 구분 판정 신뢰도. 기존 저장 결과에는 없을 수 있다.
            sourceSlides:
              type: array
              uniqueItems: true
              description: PPTX 분석 항목의 근거가 확인된 표시 순서 슬라이드 번호. 자유 텍스트 분석은 빈 배열이며 기존 저장 결과에는 없을 수 있다.
              items: { type: integer, minimum: 1 }
    AIWeeklyResult:
      type: object
      required: [summary, weekStart, dateConfidence, reportItems, warnings]
      properties:
        summary: { type: string }
        weekStart: { type: string, description: 명확하지 않으면 빈 문자열 }
        dateConfidence: { type: number, minimum: 0, maximum: 1 }
        reportItems:
          type: array
          items: { $ref: "#/components/schemas/AIReportItem" }
        warnings:
          type: array
          items: { type: string }
    ImportFile:
      type: object
      required: [id, originalFilename, fileHash, sizeBytes, status]
      properties:
        id: { type: integer, format: int64 }
        originalFilename: { type: string }
        fileHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        sizeBytes: { type: integer, format: int64 }
        status:
          type: string
          enum: [QUEUED, PROCESSING, READY, NEEDS_REVIEW, FAILED, DUPLICATE, CONFIRMED, SKIPPED]
        detectedWeekStart: { type: string }
        detectedWeekEnd: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        dateSource: { type: string }
        result: { $ref: "#/components/schemas/AIWeeklyResult" }
        errorMessage: { type: string }
        duplicateOf: { type: integer, format: int64 }
        reportId: { type: integer, format: int64 }
        conflictReportId: { type: integer, format: int64 }
    ImportJob:
      type: object
      required: [id, status, totalFiles, processedFiles, failedFiles, createdAt]
      properties:
        id: { type: integer, format: int64 }
        status:
          type: string
          enum: [PENDING, PROCESSING, READY, PARTIAL, FAILED, CONFIRMED]
        totalFiles: { type: integer }
        processedFiles: { type: integer }
        failedFiles: { type: integer }
        createdAt: { type: string, format: date-time }
        files:
          type: array
          items: { $ref: "#/components/schemas/ImportFile" }
    ImportConfirmFile:
      type: object
      required: [id, weekStart, strategy, items]
      properties:
        id: { type: integer, format: int64 }
        weekStart: { type: string, format: date }
        summary: { type: string }
        strategy: { type: string, enum: [CREATE, MERGE, REPLACE, SKIP] }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ImportConfirmItem" }
    ImportConfirmItem:
      type: object
      additionalProperties: false
      required: [category, title, currentResult, nextPlan, issue, progress]
      properties:
        category: { type: string, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 240 }
        currentResult: { type: string }
        nextPlan: { type: string }
        issue: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 1, description: 미리보기 표시용 값이며 확정 보고서에는 저장하지 않음 }
    ConfluenceSource:
      type: object
      required: [pageId, title, spaceKey, pageUrl, pageVersion, activityType]
      properties:
        pageId: { type: string }
        title: { type: string }
        spaceKey: { type: string }
        pageUrl: { type: string, format: uri }
        pageVersion: { type: integer }
        activityType: { type: string, enum: [CREATED, MODIFIED, CREATED_AND_MODIFIED] }
        sourceUpdatedAt: { type: string, format: date-time }
    ConfluenceCandidateWrite:
      type: object
      required: [normalizedTitle, category, currentResult, nextPlan, issue]
      properties:
        normalizedTitle: { type: string, minLength: 1, maxLength: 240 }
        category: { type: string, maxLength: 80 }
        currentResult: { type: string }
        nextPlan: { type: string }
        issue: { type: string }
    ConfluenceCandidate:
      allOf:
        - { $ref: "#/components/schemas/ConfluenceCandidateWrite" }
        - type: object
          required: [id, weekStart, confidence, ruleScore, status, userEdited, sources]
          properties:
            id: { type: integer, format: int64 }
            weekStart: { type: string, format: date }
            confidence: { type: number, minimum: 0, maximum: 1 }
            ruleScore: { type: integer }
            status: { type: string, enum: [DETECTED, ACCEPTED, IGNORED, MERGED, REMOVED] }
            userEdited: { type: boolean }
            sources:
              type: array
              items: { $ref: "#/components/schemas/ConfluenceSource" }
    ReportWrite:
      type: object
      required: [summary, items]
      properties:
        weekStart: { type: string, format: date }
        summary: { type: string, maxLength: 10000 }
        version: { type: integer, minimum: 1 }
        sourceType: { type: string, enum: [MANUAL, AI_TEXT, CONFLUENCE_AI] }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ReportItem" }
