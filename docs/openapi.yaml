openapi: 3.1.0
info:
  title: Weekly API
  version: 0.221.0
  description: |
    주간보고 작성·복제, 근거 검증형 Confluence 6.9.1 자동 초안, 원자 사실 AI 구조화,
    PPTX Import, 관리자 설정, 분석 및 키 관리 REST API.

    ## 화면이 쓰지 않는 응답 필드

    이 제품은 화면 말고도 개인 API 키와 MCP 서버로 읽힙니다. 아래 필드들은 응답에
    실려 나가지만 웹 화면이 그리지 않으므로, 연동하는 쪽에서는 이 문서 외에 존재를
    알 방법이 없었습니다. 계산해서 내보내면서 어디에도 적지 않는 것은 버리는 것과
    같습니다.

    **수명 주기 시각** — 모두 RFC 3339이며 아직 그 단계에 이르지 않았으면 `null`입니다.

    | 필드 | 응답 | 뜻 |
    |---|---|---|
    | `submittedAt` | 보고서 | 작성자가 제출한 시각 |
    | `reviewedAt` | 보고서 | 검토자가 승인 또는 반려한 시각. 작성자가 내용을 고치면 다시 `null`이 됩니다 |
    | `startedAt` / `completedAt` | Import 작업 | 분석이 시작·종료된 시각 |
    | `analyzedAt` / `confirmedAt` | Import 파일 | AI 분석이 끝난 시각, 보고서로 확정된 시각 |
    | `builtAt` | `/version` | 이미지 빌드 시각 |
    | `generatedAt` | 기간 보고 | 이 응답을 계산한 시각. 기간 보고는 저장하지 않고 매번 다시 계산합니다 |

    **기간 보고 인사이트** — `/rollups` 응답의 `insights` 안에 있습니다.

    | 필드 | 뜻 |
    |---|---|
    | `continuingItems` | 둘 이상의 주에 걸쳐 보고된 업무 수 |
    | `oneOffItems` | 한 주에만 나타난 업무 수 |
    | `noLandingItems` | 진척은 있으나 끝날 주차를 추정할 수 없는 업무 수 |
    | `sourceReports` / `sourceItems` | 이 집계가 읽은 원본 주간보고 수와 업무 항목 수 |
    | `dedupRate` | 중복 제거로 줄어든 비율. `sourceItems` 대비 `duplicatesCut` |

    **그 밖에**

    | 필드 | 응답 | 뜻 |
    |---|---|---|
    | `periodEnd` | `periodOutlook` | 추정의 기준이 된 기간 말일. `kind`가 `NONE`이면 없습니다 |
    | `overlapWeeks` | 협업 분석 | 두 사람이 같은 업무를 함께 보고한 주 수 |
    | `latestIssue` | 업무 목록 | 그 업무에 가장 최근 기재된 이슈 문장 |
    | `scannedCharacters` | 결정 제안 | 제안을 만들며 읽은 본문 글자 수. 0이면 읽을 것이 없었다는 뜻이며 제안 없음과 다릅니다 |
    | `roles` | 관리자 사용자 | 부여된 역할 목록. 단일 역할일 때는 생략됩니다 |
    | `semanticReason` | 업무 검색 | 의미 기반 검색이 **돌지 않은 이유**입니다. 돌았으면 빈 값이며, 0건 결과가 "찾아봤는데 없다"인지 "찾아보지 못했다"인지를 가릅니다 |
    | `accountNotice` | `/me` | **이 계정** 때문에 화면이 비어 보이는 상태를 설명합니다. 서비스 공지(`notice`)와 달리 읽는 사람 본인에 관한 것이며, 지금은 소속 조직이 없는 팀장·조직장에게만 나옵니다. 정상이면 빈 문자열입니다 |
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /version:
    get:
      security: []
      summary: 빌드 버전 조회
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /auth/providers:
    get:
      security: []
      summary: 로그인 방식과 공개 서비스 정보
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /auth/login:
    post:
      security: []
      summary: 로컬 로그인
      description: |
        실패가 auth.max_login_attempts에 이르면 auth.lockout_minutes 동안 그 계정의 로그인을
        429 TOO_MANY_ATTEMPTS로 거부한다. 차단 중에는 올바른 비밀번호도 거부된다.
        Retry-After 헤더에 남은 시간을 초 단위로 담는다. 실패 응답은 계정이 있든 없든 같다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: 로그아웃
      description: |
        세션 행을 지우고 쿠키를 만료시킨다. 쿠키가 없어도 성공으로 답한다 — 로그아웃은
        멱등이어야 하고, 이미 끊긴 세션으로 다시 부르는 것이 오류일 이유가 없다.
      tags: [Auth]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /me:
    get:
      summary: 현재 사용자와 서비스 컨텍스트
      description: |
        `user` 와 함께 이 배포에서 무엇이 켜져 있는지를 돌려준다: `workflowEnabled`,
        `aiEnabled`, `confluenceEnabled`. 화면은 이 값을 보고 **거부될 것이 확실한 요청을
        보내지 않는다.** 편집기가 Confluence 후보를 매번 물어보던 시절, 연동을 쓰지 않는
        배포는 방문마다 설정 오류를 돌려받았고 그것이 모든 사용자의 콘솔에 남았다.

        `accountNotice` 는 이 계정이 제품을 정확하지만 쓸모없게 만드는 상태에 있을 때만
        채워진다. 소속 조직이 없는 계정이 그렇다 — 그 사람의 주간보고는 어느 팀장에게도
        보이지 않는다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/current:
    get:
      summary: 현재 주차 본인 보고서
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/previous:
    get:
      summary: 직전 보고서의 차주 계획
      description: |
        작성 중인 주차보다 앞선 본인의 가장 최근 보고서에서 항목별 차주 계획을 반환합니다.
        직전 주차가 아니라 직전 보고서를 기준으로 하므로 휴가 등으로 한 주를 건너뛰어도 계획이 이어집니다.
        `matchKey`는 제목을 소문자화하고 공백을 제거한 값으로, 아직 저장되지 않아 식별자가 없는 항목과 짝지을 때 사용합니다.
        `carryOver`는 계획이 있고 진척도가 100% 미만인 항목, 즉 아직 남아 있는 계획을 표시합니다.
        직전 보고서가 없으면 `data`가 `null`입니다.
      parameters:
        - name: weekStart
          in: query
          schema: { type: string, format: date }
          description: 기준 주차 시작일. 생략하면 현재 주차
      responses:
        "200":
          description: 직전 보고서의 계획
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: [object, "null"]
                        properties:
                          reportId: { type: integer, format: int64 }
                          weekStart: { type: string, format: date }
                          status: { type: string }
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                workItemId: { type: integer, format: int64 }
                                category: { type: string }
                                title: { type: string }
                                matchKey: { type: string }
                                nextPlan: { type: string }
                                issue: { type: string }
                                progress: { type: integer }
                                carryOver: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
  /reports/quality:
    post:
      summary: 작성 중인 보고서의 품질 점검
      description: |
        저장된 사본이 아니라 요청 본문의 초안을 점검한다. 점검은 저장 전에 가장 쓸모 있고,
        저장된 것만 볼 수 있는 점검은 작성자가 이미 지나간 버전에 대해 답하게 된다.

        규칙은 결정적이며 모델을 쓰지 않는다. AI Gateway가 꺼진 환경에서도 동작한다.
        본인 이력만 근거로 삼으며 최근 26주를 본다. 점검 대상 주차의 저장본은 근거에서 제외한다.

        - PROGRESS_REGRESSED: 지난주보다 낮은 진척도
        - PLAN_REPEATED: 같은 차주 계획을 2주 이상 반복하면서 진척도도 오르지 않음
        - PLAN_WITHOUT_RESULT: 지난주 계획이 있는데 이번 주 실적이 비어 있음
        - ISSUE_PERSISTED: 같은 이슈가 rollup.persistent_issue_weeks 이상 지속

        **이미 조치한 사람에게 조치하라고 반복하지 않는다.** 조치한 사람에게 같은 말을
        되풀이하면 점검 목록 전체가 무시된다.

        - 이미 상위 조직 요청으로 올린 이슈는 `회신 여부를 확인하세요`로 바뀐다.
        - **선행 업무를 등록해 둔 업무의 `PLAN_REPEATED`는 WARN이 아니라 INFO가 되고,
          "막힌 이유를 이슈로 적어 주세요" 대신 무엇을 기다리는지 이름을 대며 그 관계가
          아직 유효한지 묻는다.** 계획을 반복한 사실은 여전히 볼 만하므로 소견 자체는
          남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                weekStart: { type: string, format: date, description: 생략하면 현재 주차 }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/ReportItem" }
      responses:
        "200":
          description: 점검 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          week: { type: string, format: date }
                          checked: { type: integer }
                          findings:
                            type: array
                            items:
                              type: object
                              properties:
                                rule: { type: string }
                                severity: { type: string, enum: [WARN, INFO] }
                                title: { type: string }
                                message: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /reports/current/candidates:
    get:
      summary: 현재 주차 Confluence 자동 초안과 Sync 상태
      responses:
        "200":
          description: 사용자별 자동 초안
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          weekStart: { type: string, format: date }
                          candidates:
                            type: array
                            items: { $ref: "#/components/schemas/ConfluenceCandidate" }
  /report-candidates/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      summary: 본인 Confluence 자동 초안 수정 및 사용자 수정 보호
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfluenceCandidateWrite" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: 본인 자동 초안을 제외하고 같은 주차 재생성 방지
      responses:
        "204": { description: 제외 완료 }
        "404": { $ref: "#/components/responses/Error" }
  /report-candidates/{id}/sources:
    get:
      summary: 본인 자동 초안의 Confluence 원본 Page 목록
      parameters:
        - { $ref: "#/components/parameters/ID" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /report-candidates/accept:
    post:
      summary: 자동 초안을 저장한 본인 보고서에 연결
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, reportId]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, format: int64 }
                reportId: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /team/reports:
    get:
      summary: 조직 구성원 보고서 목록, 팀장 이상
      description: |
        조회 권한 범위의 보고서를 `/reports`와 같은 형식으로 반환한다.
        `{items, total, limit, offset}`이며 limit 기본 200, 최대 500이다.

        담당자 목록을 만들 목적으로 쓰지 말 것. 이 응답은 한 쪽일 뿐이라 최근에
        보고한 사람만 담긴다. 사람 목록은 `/team/members`에 있다.
      parameters:
        - { in: query, name: weekStart, schema: { type: string, format: date } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/ReportStatus" } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /team/members:
    get:
      summary: 인수인계·조회 대상 담당자 목록, 팀장 이상
      description: |
        이 사용자가 업무를 열어 볼 수 있는 사람을 반환한다. id, displayName,
        organizationName, active, lastWeek(마지막 보고 주차, 없으면 빈 문자열).

        **비활성 계정도 포함한다.** 인수인계 화면이 쓰는 목록이고, 넘겨받아야 할
        업무를 남긴 사람은 대개 이미 떠난 사람이다. 이전에는 이 목록을 팀 보고서
        한 쪽에서 만들어서, 최근 5주 안에 보고하지 않은 사람은 고를 수 없었다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /reports:
    get:
      summary: 권한 범위 보고서 검색
      description: |
        **응답은 배열이 아니라 `{items, total, limit, offset}` 객체다.** 이전에는 배열을
        그대로 돌려주면서 SQL에 `LIMIT 500`만 걸려 있었다. 담당자 120명·26주에서
        보고서 3,120건이 500건으로 잘려 나갔고 응답에는 잘렸다는 표시가 없었다.

        limit 기본값 200, 최대 500. 범위를 벗어나면 가까운 끝으로 잘라 맞춘다 —
        상한보다 크면 상한, 1보다 작으면 1이다(0이나 음수도 기본값이 아니라 1이다).
        읽을 수 없는 값은
        기본값으로 본다. offset으로 다음 쪽을 가져온다. 정렬은 주차 내림차순, 이름,
        보고서 식별자 순이며 마지막 항목이 쪽 사이의 순서를 고정한다.
      parameters:
        - { in: query, name: weekStart, schema: { type: string, format: date } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/ReportStatus" } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: 보고서 생성
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportWrite" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
  /reports/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      summary: 보고서 상세
      description: |
        각 업무 항목에 `sources`가 붙는다. 그 줄이 무엇을 근거로 적혔는지이며,
        kind(MANUAL·CONFLUENCE·PPTX·AI_TEXT·JIRA·GIT·CI·ITSM·API), reference, title,
        url, detail, occurredAt를 담는다.

        **비어 있다는 것은 근거가 없다는 뜻이 아니다.** 직접 타이핑했거나 이 모델이 생기기
        전에 작성됐다는 뜻이며, 근거가 기록된 경로에서만 채워진다.

        Confluence 자동 초안에서 온 줄은 그 초안의 페이지·버전·활동 종류를 담는다.
        편집기가 항목에 실어 보내는 `candidateId`로 연결되며, 그 식별자가 본인 초안을
        가리키는지는 서버가 확인한다.

        보고서의 `sourceType`은 보고서 전체가 어디서 왔는지를 말하고 이것은 **줄마다**
        말한다. 이전에는 후자가 없었다 — Confluence 후보의 페이지도 PPTX 항목의 슬라이드
        번호도 항목이 만들어지는 순간 버려졌다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
    put:
      summary: 본인 보고서 낙관적 잠금 수정
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportWrite" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: 본인 보고서 낙관적 잠금 삭제
      parameters:
        - in: query
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: 삭제 완료 }
        "409": { $ref: "#/components/responses/Error" }
  /reports/{id}/submit:
    post:
      summary: 보고서 제출 또는 즉시 확정
      description: |
        **업무 항목이 없는 보고서는 제출할 수 없다.** 409 `EMPTY_REPORT`를 반환하고
        상태는 그대로 둔다. 작성 중인 초안은 비어 있어도 된다 — 초안이란 그런 것이다.
        제출은 한 주가 끝났다고 말하는 행위이므로 그 지점에서 막는다.

        이 규칙은 원래 화면에만 있었다. 빈 본문으로 `POST /reports`를 부르면 항목 없는
        보고서가 만들어졌고, 그대로 제출·검토·승인까지 갔다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /reports/{id}/clone:
    post:
      summary: 본인 보고서를 새 주차의 독립된 초안으로 복제
      description: 승인 이력, 댓글, 외부 출처 연결과 원본 항목 ID는 복사하지 않는다. 대상 주차가 없으면 현재 주차를 사용한다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetWeekStart: { type: string, format: date, description: 관리자가 설정한 주차 시작 요일이어야 함 }
                mode: { type: string, enum: [STRUCTURE, FULL], default: STRUCTURE }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /reports/{id}/approve:
    post:
      summary: 제출 보고서 승인
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/{id}/reject:
    post:
      summary: 제출 보고서 반려
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /reports/{id}/comments:
    post:
      summary: 보고서에 의견 남기기
      description: |
        보고서를 볼 수 있는 사람만 의견을 남길 수 있다. 검토자가 반려 사유를 적는 자리와
        달리 이쪽은 상태를 바꾸지 않는다 — 읽은 사람이 남기는 말이지 결재가 아니다.

        본문은 1~5000자다. 빈 의견은 기록이 아니라 실수이므로 거절한다.
      tags: [Reports]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { description: 의견이 비었거나 5000자를 넘는다 }
        "403": { description: 이 보고서를 볼 권한이 없다 }
  /reports/{id}/attachments:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      summary: 보고서 화면 캡처 목록
      description: |
        각 항목의 `available`은 저장된 이미지 파일을 읽을 수 있는지를 나타낸다.

        이미지 정보는 PostgreSQL에, 파일은 `/var/lib/weekly` 상태 볼륨에 나뉘어 저장되므로
        볼륨을 유지하지 않고 업그레이드하면 항목은 남고 파일만 사라진다. 이 경우 `available`이
        false가 되며 해당 이미지는 내보내기와 발표에서 제외된다. 다시 첨부해야 복구된다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: 화면 캡처 이미지 첨부, 본인 보고서만
      description: multipart/form-data. `files`에 PNG, JPEG, GIF를 담고 `placement`로 본문 앞뒤를 지정한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                placement: { type: string, enum: [BEFORE, AFTER], default: AFTER }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /reports/{id}/attachments/{attachmentId}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { in: path, name: attachmentId, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 첨부 이미지 원본
      description: |
        404는 두 가지 원인을 구분해 반환한다. `ATTACHMENT_NOT_FOUND`는 해당 보고서에 그
        항목이 없는 경우이고, `ATTACHMENT_FILE_MISSING`은 항목은 있으나 저장된 파일이 없는
        경우다. 후자는 상태 볼륨이 유실된 상황이며 이미지를 다시 첨부해야 한다.
      responses:
        "200":
          description: 이미지 바이트
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: 캡처 설명, 삽입 위치와 순서 변경
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: { type: string, maxLength: 240 }
                placement: { type: string, enum: [BEFORE, AFTER] }
                sortOrder: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      summary: 첨부 이미지 삭제
      responses:
        "204": { description: 삭제 완료 }
        "403": { $ref: "#/components/responses/Error" }
  /reports/{id}/export.pptx:
    get:
      summary: 템플릿 기반 PPTX 다운로드, 첨부한 화면 캡처를 본문 앞뒤 슬라이드로 포함
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: PowerPoint 파일
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
  /ai/reports/parse-text:
    post:
      summary: 자유 텍스트를 저장하지 않고 주간보고 미리보기로 구조화
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 200000 }
      responses:
        "200":
          description: 검증된 AI 미리보기
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AIWeeklyResult" }
        "503": { $ref: "#/components/responses/Error" }
  /import/pptx:
    post:
      summary: 과거 PPTX 다중 업로드 및 비동기 분석 작업 생성
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "503": { $ref: "#/components/responses/Error" }
  /import/history:
    get:
      summary: 본인의 PPTX Import 작업 이력
      description: |
        `{items, total, limit, offset}`. limit 기본 50, 최대 200. 이전에는 배열을
        `LIMIT 100`으로 잘라 돌려주면서 잘렸다는 표시가 없었다.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /import/{id}:
    get:
      summary: 본인의 Import 작업과 파일별 분석 미리보기
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Import 작업 상세
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/Error" }
  /import/{id}/analyze:
    post:
      summary: 보관 원본이 있는 미확정 PPTX 파일 재분석
      description: 본문을 생략하면 기존 동작과 같이 실패 파일 전체를 재시도한다. fileIds를 지정하면 해당 작업에서 원본이 남은 FAILED, READY 또는 NEEDS_REVIEW 파일만 최신 파이프라인으로 재분석한다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fileIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: integer, format: int64, minimum: 1 }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /import/{id}/confirm:
    post:
      summary: 사용자가 수정한 과거 보고 미리보기 확정
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/ImportConfirmFile" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /keys:
    get:
      summary: 개인 API 키 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: 개인 API 키 발급
      description: |
        `Authorization: Bearer wky_...`로 쓰는 개인 키를 발급한다. 발급 직후 한 번만
        전체 토큰을 반환한다.

        **키는 조회 전용이며 기본 거부다.** 어떤 범위로도 저장·수정·삭제를 할 수 없고,
        아래에 적힌 경로 밖은 열리지 않는다. 키는 **주인을 넘어서지 못한다** — 역할 검사가
        그대로 뒤에 이어지므로, 일반 사용자의 키에 analytics:read를 넣어도 팀 분석은
        볼 수 없다.

        | 범위 | 열리는 것 |
        |---|---|
        | (범위 무관) | `GET /me`, `GET /version` |
        | `reports:read` | `GET /reports…`, `GET /team/reports…`, `GET /rollups…`, `GET /search` |
        | `analytics:read` | `GET /analytics…` |
        | `mcp:read` | `POST /mcp` |

        그 밖의 경로(업무 추적, 인수인계, 회의 모드, 경영 요약, 업무 인사이트,
        담당자 목록, 관리자 화면)는 **어떤 범위로도 열리지 않는다.** 거부 응답은
        범위가 없어서인지 경로 자체가 닫혀 있어서인지를 구분해 말한다.

        `POST /keys/rotate`는 키 버전을 올려 **기존 키를 즉시 무효화한다.** 조회 질의가
        키 버전을 대조하므로 폐기 표시와 무관하게 다음 요청부터 401이 된다.
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /keys/{id}:
    delete:
      summary: 개인 API 키 폐기
      description: |
        본인의 키만 폐기할 수 있다. 이미 폐기됐거나 남의 키를 가리키면 `KEY_NOT_FOUND` 를
        돌려준다 — 남의 키가 존재하는지조차 알려 주지 않기 위해서다.
      tags: [Keys]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { description: 본인의 살아 있는 키가 아니다 }
  /keys/rotate:
    post:
      summary: 개인 키 버전 회전 및 전부 폐기
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /search:
    get:
      summary: 권한 범위 보고서 내용 검색
      description: |
        업무 제목·구분, 주간 요약, 실적, 계획, 이슈 본문을 대소문자 구분 없이 검색한다.
        여러 단어는 AND로 결합하며 일반 사용자는 본인, 팀장·조직장은 하위 조직, 관리자는 전체를 대상으로 한다.
        일치한 위치의 문장을 스니펫으로 함께 반환한다.

        정확 일치 결과가 5건 미만이면 다음 단계를 이어서 수행한다. 각 단계는 앞 단계가
        이미 찾은 보고서를 건너뛴다.

        1. pg_trgm이 설치돼 있으면 word_similarity로 표기가 비슷한 보고서를 찾고
           응답의 fuzzy를 true로, 해당 hit의 approximate를 true로 표시한다.
        2. pgvector가 설치되고 임베딩 모델이 설정돼 있으면 코사인 거리로 의미가 가까운
           보고서를 찾고 응답의 semantic을, 해당 hit의 semantic을 true로 표시한다.

        두 확장이 모두 없으면 1단계 정확 일치만 수행하며 기존 동작과 같다.
      parameters:
        - { name: q, in: query, required: true, description: "2자 이상. 공백으로 나눈 단어는 최대 6개까지 사용한다.", schema: { type: string } }
      responses:
        "200":
          description: 검색 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          query: { type: string }
                          terms: { type: array, items: { type: string } }
                          truncated: { type: boolean, description: 결과가 많아 일부만 반환했는지 }
                          fuzzy: { type: boolean, description: 표기 유사 단계가 결과에 포함됐는지 }
                          semantic: { type: boolean, description: 의미 유사 단계가 결과에 포함됐는지 }
                          hits:
                            type: array
                            items:
                              type: object
                              properties:
                                reportId: { type: integer, format: int64 }
                                weekStart: { type: string, format: date }
                                displayName: { type: string }
                                status: { $ref: "#/components/schemas/ReportStatus" }
                                score: { type: integer }
                                approximate: { type: boolean, description: 정확 일치가 아닌 유사 일치인지 }
                                semantic: { type: boolean, description: 의미 기반 일치인지 }
                                matches:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      field: { type: string }
                                      label: { type: string }
                                      title: { type: string }
                                      snippet: { type: string }
  /work-items:
    get:
      summary: 주차를 넘어 이어지는 업무와 경과 추적
      description: |
        업무별로 경과 주차, 보고 누락 주차, 진척 정체 구간, 이슈 이력 주차(issueWeeks)와
        지금 열려 있는 이슈의 지속 주차(issueRunWeeks), 계획 반복 횟수와
        주차별 기록을 반환한다. 모든 값은 주차 스냅샷에서 파생하므로 별도 갱신이 필요 없다.

        forecast 는 보고된 진척으로 계산한 완료 시점 추정이고, dueOutlook 은 마감일이 있을 때
        그 날짜에 닿을 진척도다. 둘 다 계산 근거인 속도를 함께 담는다.

        agreedDue 는 마감일이 없는 미완료 업무에만 실린다. 회의에서 이미 합의돼 결정의 후속
        기한으로 기록된 날짜 중 가장 이른 것이며, 자동으로 마감일이 되지는 않는다. 후속 조치가
        업무 전체와 같다는 보장이 없으므로 담당자가 확인해 지정한다.
      parameters:
        - { name: scope, in: query, description: "TEAM은 팀장 이상만 조회할 수 있습니다.", schema: { type: string, enum: [SELF, TEAM], default: SELF } }
        - { name: limit, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: items·total·limit·offset. 목록 행에는 weeks 가 없다.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { type: object } }
                          total: { type: integer }
                          limit: { type: integer }
                          offset: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /work-items/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      summary: 업무 한 건과 주차별 기록 전체
      description: |
        목록은 weeks 를 싣지 않는다. 주차별 기록이 응답의 대부분이고 목록 화면은 그것을
        그리지 않기 때문이다. 300명 배포에서 조직 전체 목록이 23.6MB였고 그중 19MB가
        화면에 나오지 않는 주차별 본문이었다. 상세 대화상자를 열 때 이 경로로 한 건만
        가져온다.

        조회 범위는 목록과 같은 술어를 쓴다. 볼 수 없는 사람의 업무는 여기서도 보이지 않는다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /work-items/{id}/merge:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      summary: 잘못 나뉜 업무를 하나로 합치기
      description: |
        이 업무의 모든 주차 스냅샷을 intoId 업무로 옮기고, 이 업무는 대상 업무를 가리키는
        표시만 남긴다. 행과 정규화 키를 지우지 않는 것이 핵심이다. 업무 식별은 저장할 때마다
        제목에서 다시 유도하므로, 행을 지우면 다음 보고서가 같은 제목을 쓰는 순간 업무가
        다시 만들어져 합친 결과가 사라진다.

        본인 업무만 정리할 수 있으며 관리자는 대신 수행할 수 있다. 팀장은 할 수 없다.
        보고서를 검토하는 권한과 남의 이력을 고쳐 쓰는 권한은 다르다.
        담당자가 서로 다른 업무끼리는 합칠 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intoId]
              properties:
                intoId: { type: integer, format: int64, description: 합칠 대상 업무 }
      responses:
        "200":
          description: 합친 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          workItemId: { type: integer, format: int64 }
                          movedItems: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /work-items/{id}/due-date:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    put:
      summary: 업무 마감일 설정 또는 해제
      description: |
        업무에 마감일을 지정한다. 빈 문자열을 보내면 마감일을 지운다. 잘못 넣은 날짜를
        다른 잘못된 날짜로만 바꿀 수 있다면 없느니만 못하므로, 해제를 표현할 수 있어야 한다.

        마감일이 있으면 업무 조회 응답의 dueOutlook 이 보고된 속도로 그 날짜에 몇 %에
        닿는지를 함께 계산한다. kind 는 NONE, FINISHED, UNKNOWN, ON_TRACK, SPLIT,
        AT_RISK, OVERDUE 이며 언제나 projectedLow·projectedHigh 와 근거 문장이 함께
        온다. SPLIT 은 전체 평균 속도와 최근 속도가 서로 다른 답을 낸다는 뜻이고, 그
        엇갈림 자체가 결론이므로 한쪽으로 합치지 않는다.

        본인 업무 또는 관리자만 설정할 수 있다. 다른 업무로 합쳐진 업무에는 설정할 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueDate]
              properties:
                dueDate:
                  type: string
                  description: YYYY-MM-DD, 또는 해제하려면 빈 문자열
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /work-items/{id}/split:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      summary: 하나로 잘못 묶인 업무에서 일부 주차를 떼어내기
      description: |
        선택한 주차 스냅샷을 새 제목의 업무로 옮기고 그 연결을 고정한다. 고정하지 않으면
        해당 보고서를 다시 저장할 때 제목에서 유도한 원래 업무로 되돌아간다. 고정은 제목이
        그대로인 동안만 유지된다. 제목을 바꾸는 것은 업무가 무엇인지에 대한 진술이므로 그때는
        다시 유도하는 편이 맞다.

        모든 주차를 옮기는 것은 분리가 아니라 이름 변경이므로 거부한다. 이름만 바꾸려면
        보고서에서 업무 제목을 수정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, reportItemIds]
              properties:
                title: { type: string, maxLength: 240 }
                category: { type: string, maxLength: 80 }
                reportItemIds:
                  type: array
                  items: { type: integer, format: int64 }
                  description: 업무 조회 응답의 weeks[].itemIds에서 얻는다
      responses:
        "200":
          description: 분리한 결과
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          workItemId: { type: integer, format: int64 }
                          movedItems: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /rollups:
    get:
      summary: 월간·분기·반기·연간 기간 보고 집계
      description: |
        `kind` 는 WEEK·MONTH·QUARTER·HALF·YEAR 다. WEEK 의 식별자는 그 주의 시작일
        `yyyy-mm-dd` 이며 `weekly_reports.week_start` 와 같은 형식을 쓴다. ISO 주차 번호를
        새로 만들면 한 주를 부르는 방식이 둘이 되고, 주차 시작 요일을 바꾸는 순간 둘이
        어긋난다. 시작일이 아닌 날짜를 주면 그 날이 속한 주로 맞춘다.

        기간에 겹치는 주간보고를 취합해 중복 업무와 반복 기재를 제거한 업무 목록,
        완료율·정체·이슈 지속·보고 커버리지 인사이트와 주차별 추이를 반환합니다.
        저장하지 않고 요청할 때마다 원본 주간보고에서 다시 계산합니다.

        같은 업무인지는 v0.18.0부터 **저장된 WorkItem 식별자**가 결정합니다. 한 담당자 안에서는
        본인이 병합·분리한 결과가 그대로 적용되고, 제목 유사도 추측은 사용하지 않습니다.
        담당자 사이에서는 사람을 가로지르는 저장된 식별자가 없으므로 제목 유사도를 계속 사용합니다.
        기간 보고는 조직의 한 업무를 사람 수만큼이 아니라 한 줄로 보여 주기 위한 것이기 때문입니다.

        식별자가 없는 과거 행은 이전과 동일하게 제목 규칙으로 묶습니다.

        `decisions`는 이 기간에 **결정된** 기록이며, 이 보고서가 다루는 사람들의 업무에
        달린 것만 담는다. 사람 범위 조건은 집계와 **같은 조건**을 쓴다 — 한쪽 사람들을
        집계하면서 다른 쪽 결정을 나열하는 보고서는 결정을 아예 안 넣느니만 못하다.

        최대 50건이며 `decisionTotal`로 전체 건수를, `openDecisions`로 후속 조치가 남은
        수를, `decisionLimit`으로 상한을 함께 반환한다. 업무별 전체 이력은
        `/work-items/{id}/decisions`에 있다.

        `issueClearance`는 이 기간에 **해소로 기록된** 이슈의 건수와 지속 주 수(중앙값·최장)다.
        주차별 행은 이슈가 몇 주 이어졌는지는 알지만 어떻게 끝났는지는 모른다 — 해결된 것과
        포기한 것이 데이터에서 같아 보인다. 그래서 이슈란이 비는 주에 작성자에게 한 번 묻고,
        그 답만 저장한다. 아무도 답한 적이 없으면 resolved 가 0이며, 화면은 0을 측정값처럼
        보여 주지 않고 아직 없음으로 적는다.

        평균이 아니라 중앙값이다. 1년 끌던 장애물 하나가 평균을 실제 장애물이 서 있지 않은
        곳으로 끌고 가는데, 이 숫자가 답하려는 질문은 보통 얼마나 걸리는가이기 때문이다.

        각 항목의 `periodOutlook`은 보고된 속도를 **이 보고서의 기간 말까지** 이어 붙인 결과다.
        마감일 입력이 필요 없다 — 경계는 요청에 이미 들어 있다. kind 는 NONE, LANDS, SPLIT,
        SHORT, FINISHED 이며 언제나 projectedLow·projectedHigh 와 근거 문장이 함께 온다.
        약속된 마감이 아니라 보고 창의 경계이므로 `dueOutlook` 과 문구를 구분한다.

        이미 끝난 기간에는 추정하지 않는다(NONE). 결과가 이미 있는데 추정을 내놓는 것은
        예보가 아니라 예보처럼 보이는 잡음이다. 진척이 늘지 않은 업무도 추정하지 않는다 —
        늘릴 속도가 없고, 정체 규칙이 이미 더 정확하게 말한다.

        `items`는 전부 반환하지만 주차별 계열(`weeks`)은 앞의 `timelineItems`건만 싣는다.
        타임라인이 그리는 것이 그만큼이고 아래 표는 그것을 읽지 않기 때문이다. 연간 조직
        전체 응답 885KB 중 522KB가 어떤 차트도 그리지 않을 업무의 주차별 본문이었다.
        CSV·PPTX 내보내기는 별도 경로이고 전체 뷰에서 만들므로 영향이 없다.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [MONTH, QUARTER, HALF, YEAR], default: MONTH } }
        - { name: period, in: query, description: "2026-08, 2026-Q3, 2026-H2, 2026. 생략하면 현재 기간", schema: { type: string } }
        - { name: scope, in: query, description: "TEAM은 팀장 이상만 조회할 수 있습니다.", schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /rollups/export.csv:
    get:
      description: |
        기간 집계를 CSV로 내려받는다. 보고 본문은 사용자가 입력한 값이므로 `=`, `+`, `@`,
        탭, 캐리지리턴으로 시작하는 셀 앞에 작은따옴표를 붙여 스프레드시트가 수식으로
        실행하지 않게 한다. `-` 뒤에 공백이 오는 경우는 글머리표이므로 그대로 둔다.

        **업무 표만 담는다.** 열은 구분·업무·담당·실적·다음 계획·이슈·상위 조직 요청·
        진척도·수행 주차·시작 주차·최종 주차·상태 열두 개다. 같은 기간의 `decisions`
        (결정 기록)와 `issueClearance`(이슈 해소)는 업무와 열이 다른 별개의 표이므로
        여기 섞지 않는다 — 한 파일에 표 둘을 넣으면 어느 도구도 읽지 못한다. 결정은
        `GET /rollups` 응답과 기간 보고 PPTX에 있다.
      summary: 기간 보고 업무 표 CSV 내보내기
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [MONTH, QUARTER, HALF, YEAR], default: MONTH } }
        - { name: period, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200":
          description: UTF-8 BOM CSV
          content:
            text/csv:
              schema: { type: string, format: binary }
  /rollups/export.pptx:
    get:
      summary: 기간 보고 PPTX 내보내기
      description: 표지, 경영 인사이트, 업무 현황표, 업무 상세, 이슈로 구성된 기간 보고 전용 레이아웃을 내용량에 맞춰 분면해 내보냅니다.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [MONTH, QUARTER, HALF, YEAR], default: MONTH } }
        - { name: period, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200":
          description: PPTX 파일
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, format: binary }
        "409": { $ref: "#/components/responses/Error" }
  /analytics/overview:
    get:
      summary: 조직 보고 현황 분석
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /analytics/endpoints:
    get:
      summary: 최근 24시간 API 분석, 관리자 전용
      description: |
        경로별 호출 수와 평균·최대 응답시간, 그리고 두 가지 실패 수치를 돌려준다.

        `serverErrors` 는 5xx, 즉 이 서비스가 응답하지 못한 횟수다. 장애 지표는
        이쪽이다.

        `errorRate` 는 4xx 이상의 비율이므로 틀린 비밀번호, 권한 밖의 요청, 형식이
        맞지 않는 입력처럼 **정상적으로 거부된** 요청을 모두 포함한다. 높다고 해서
        고장이 아니며, 로그인 화면이 세션을 확인하는 401도 여기에 들어간다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /present/theme:
    get:
      summary: 발표 화면 강조색
      description: |
        조직이 올린 PPTX 템플릿의 테마에서 accent1 색을 읽어 반환한다. 내보낸 파일과 화면이
        같은 색을 쓰게 하기 위한 것이다. 지금까지 파일은 회사 템플릿을, 화면은 고정된
        파랑·청록을 써서 같은 보고가 매체에 따라 다른 회사 자료처럼 보였다.

        accent1만 읽는다. 화면 덱은 강조색 하나를 중심으로 구성돼 있어 서체와 나머지 다섯
        강조색은 놓일 자리가 없다. 템플릿을 읽을 수 없으면 accent 없이 source만 반환하고
        화면은 기본색을 유지한다. source는 TEMPLATE(관리자 업로드), REFERENCE(내장 기본),
        DEFAULT(읽지 못함)다.
      responses:
        "200":
          description: 강조색
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accent: { type: string, example: "#2563EB" }
                          source: { type: string, enum: [TEMPLATE, REFERENCE, DEFAULT] }
                          name: { type: string }
  /changes:
    get:
      summary: 지난주 대비 주간 변화 요약
      description: |
        업무별로 지난주와 이번 주 스냅샷을 비교해 완료·신규·재개·진척·진척도 역행·정체·보고 누락으로
        분류한다. AI 없이 결정적으로 계산하며, 분류 로직은 회의 모드와 **같은 함수**를 쓴다.
        화면마다 따로 구현하면 같은 업무가 한 화면에서는 완료로, 다른 화면에서는 진척으로 보이고
        읽는 사람이 둘 다 믿지 않게 된다.

        그대로 진행 중인 업무(STEADY)는 reported에는 세지만 목록에는 넣지 않는다. 이미 보고서에
        적혀 있는 내용을 요약이 다시 반복하면 요약이 아니다. 완료된 뒤 보고에서 빠진 업무는
        누락이 아니라 정상이므로 제외한다.

        분류에는 정체 주차와 미보고 주차가 필요하므로 최근 26주 이력을 함께 읽는다.
      parameters:
        - { name: week, in: query, schema: { type: string, format: date }, description: 생략하면 현재 주차 }
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200":
          description: 주간 변화
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          week: { type: string, format: date }
                          previousWeek: { type: string, format: date }
                          scope: { type: string }
                          reported: { type: integer }
                          changed: { type: integer }
                          groups:
                            type: array
                            items:
                              type: object
                              properties:
                                kind: { type: string, enum: [COMPLETED, NEW, RESUMED, PROGRESSED, REGRESSED, STALLED, SILENT] }
                                title: { type: string }
                                count: { type: integer }
                                entries: { type: array, items: { type: object } }
                                limit: { type: integer, description: 한 그룹이 싣는 최대 항목 수. count 가 이보다 크면 변화가 큰 것부터 limit 개만 담깁니다. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/mail:
    get:
      summary: 주간보고 메일 발송 설정과 최근 발송 결과
      description: |
        `relayReady`는 관리자가 SMTP를 설정했는지다. 켜 두었는데 아무것도 오지 않는 사람은
        자기 실수와 미설정 서버를 구별할 수 있어야 한다. `deliveries`는 최근 10건이며
        `status`는 QUEUED·SENT·FAILED, `error`는 릴레이가 준 거절 사유 그대로다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      relayReady: { type: boolean }
                      address: { type: string }
                      onSubmit: { type: boolean }
                      deliveries:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            weekStart: { type: string, format: date }
                            address: { type: string }
                            status: { type: string, enum: [QUEUED, SENT, FAILED] }
                            attempts: { type: integer }
                            error: { type: string }
                            createdAt: { type: string, format: date-time }
                            sentAt: { type: string, format: date-time, nullable: true }
                            nextAttemptAt:
                              type: string
                              format: date-time
                              nullable: true
                              description: 다음 재시도 예정 시각. 한 번이라도 시도했다가 실패해 대기 중인 건에만 있다. 기다리는 중인 것과 멈춘 것은 이 값으로만 구별된다.
    put:
      summary: 주간보고 메일 발송 설정 저장
      description: |
        `address`는 표시 이름이나 목록이 아닌 주소 하나여야 한다. `onSubmit`을 켜면서
        주소를 비우는 것은 거부한다 — 설정된 것처럼 보이면서 아무것도 보내지 않는 유일한
        조합이기 때문이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address: { type: string }
                onSubmit: { type: boolean }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
  /admin/mail/health:
    get:
      summary: 최근 주간보고 메일 발송 현황, 관리자 전용
      description: |
        최근 14일의 발송·대기·실패 건수와 대상 사용자 수, 그리고 **마지막 실패 사유를 릴레이가 준
        문장 그대로** 돌려준다. 작성자는 자기 발송만 보므로, 이것이 없으면 릴레이가 전원을 거부하는
        상태와 아직 아무도 쓰지 않은 상태가 운영자에게 똑같이 보인다. 연결 시험은 지금 이 순간만
        말하고, 지난 월요일이 나갔는지는 말하지 않는다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      days: { type: integer }
                      sent: { type: integer }
                      queued: { type: integer }
                      failed: { type: integer }
                      writers: { type: integer }
                      lastError: { type: string }
                      lastFailedAt: { type: string, format: date-time, nullable: true }
        "403": { $ref: "#/components/responses/Error" }
  /admin/settings/mail/test:
    post:
      summary: SMTP 연결 시험, 관리자 전용
      description: |
        시험 메일은 **요청한 관리자 본인**에게 간다. 임의의 주소로 보낼 수 있는 시험은
        이 서버에서 모르는 사람에게 메일을 보내는 수단이 되고, 여기서 묻는 것은 릴레이가
        동작하는지 하나뿐이다.
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /meeting:
    get:
      summary: 회의 모드 안건
      description: |
        회의 안건에 **타 조직 대기** 구획이 들어간다. 다른 조직의 업무가 끝나야 진행되는
        미완료 업무이며, 지속 이슈 뒤·변경점 앞에 놓인다. 한 팀 안의 의존은 그 두 사람이
        정리하지만, 조직을 넘는 의존은 양쪽에 말할 수 있는 사람이 방에 있어야 풀린다.

        해당 주차에서 회의가 다뤄야 할 것만 구획으로 나눠 반환한다. 지난주와 비교해
        달라지지 않은 업무는 포함하지 않는다.

        구획은 결정 필요(상위 조직 요청), 신규 이슈, 지속 이슈, 변경점(신규·완료·진척 변화·정체),
        보고 누락 순이며 회의가 먼저 해결해야 하는 순서를 따른다.
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
        - { name: week, in: query, description: "생략하면 현재 주차", schema: { type: string, format: date } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /digest:
    get:
      summary: 경영 요약, 팀장 이상
      description: |
        조회 권한 범위의 업무 중 확인이 필요한 최대 10건을 선정한다. 점수는 관측 가능한
        사실의 합이며 각 항목은 선정 근거(grounds)를 함께 반환한다.

        **grounds는 문자열 배열이 아니라 객체 배열이다.** 각 원소는 kind(DECISION,
        ISSUE, STALLED, BLOCKED, SILENT, DUPLICATE, DONE), text, points를 갖고,
        points의 합은 score와 같다.

        `BLOCKED`는 **원인이 등록된 정체**다. 점수는 `STALLED`와 같다 — 일이 멈춘
        정도는 같기 때문이다. 다른 것은 읽는 사람이 할 일이다: `진척 정체`를 보면
        담당자에게 묻고, `타 조직 대기`를 보면 두 조직을 연결한다. 같은 멈춤에 다른
        조치이므로 같게 읽혀서는 안 된다. headline도 `타 조직 대기` 또는
        `선행 업무 대기`로 갈린다. 이전에는 총점과 문장만 있어서 어느 근거가 점수를 얼마나
        올렸는지 알 수 없었고, 항목 사이의 순위를 근거로 따질 수 없었다.

        완료 업무의 과거 이슈 이력은 위험으로 집계하지 않으며, 진척 변화 없이 매주 100%로
        보고되는 운영성 업무는 완료로 집계하지 않는다.

        `considered`는 살펴본 업무 수, `limit`는 한 번에 싣는 최대 수(10)다.
        `equallyUrgent`는 **마지막으로 실린 항목과 같은 점수 이상인 업무 수**이며,
        이 값이 `entries` 길이보다 크면 동점 무리를 가로질러 잘린 것이다. 점수가 조금이라도
        붙은 업무 수가 아니다 — 실제 배포에서 543건 중 468건이 근거를 하나쯤 갖고 대개
        +25 한 줄이므로, 그 수를 보여 주면 반대 방향으로 오해를 부른다.
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 52, default: 8 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /insights/work-graph:
    get:
      summary: 조직 간 유사·중복 업무와 협업 지도, 팀장 이상
      description: |
        비교 자체는 업무 수의 제곱에 비례하지만 응답의 similar와 duplicates에는
        **관련도 상위 200건씩만** 담고, 조건에 맞는 전체 건수를 similarTotal,
        duplicateTotal로 함께 반환한다. 이전에는 모든 쌍을 담았고, 업무 1,800건에서
        234,900개 링크와 158MB 본문이 나왔다.

        `bottlenecks`는 **추측이 아니라 담당자가 직접 등록한 선행 관계**를 집계한 것으로,
        이 화면의 다른 항목과 성격이 다르다. 미완료 업무 2건 이상을 막고 있는 선행 업무를
        최대 20건 담는다.

        **범위는 막히는 쪽에 적용한다.** 막는 쪽에 적용하면 팀장은 자기 조직이 소유한
        병목만 보게 되는데, 정작 필요한 것은 다른 조직의 업무가 자기 팀 넷을 막고 있다는
        사실이다. 그래서 선행 업무의 제목과 담당자는 조회 범위 밖이어도 나온다 — 그 관계를
        등록한 것이 이쪽 사람들이고, 다른 조직의 업무 제목은 이 화면의 다른 항목에도 이미
        나온다. 완료된 선행 업무는 제외한다.

        collaboration은 상한과 무관하게 **조건에 맞는 모든 쌍**에서 집계한다. 조직 쌍
        단위로 묶여 원래 작기 때문이며, 상위 200건만으로 만들면 조직 쌍이 통째로 사라진
        지도를 완전한 것처럼 보여 주게 된다.

        제목 토큰 일치로 담당자가 다른 업무를 연결한다. 상투어만 겹치는 제목과 같은
        담당자의 업무는 제외한다. 판정은 모두 사람이 확인할 후보이며 확정 사실이 아니다.

        duplicates는 조직이 다르고 유사도 70 이상이며 양쪽 모두 미완료이고 보고 기간이
        겹치는 경우, similar는 유사도 50 이상의 나머지 연결이다. collaboration은 조직 쌍별
        연결 업무 수와 주제, recurring은 4주 이상·주기 60% 이상·진척 변화 10% 이하인
        운영성 업무다.
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /evidence/uses:
    get:
      summary: 이 근거를 쓴 보고
      description: |
        정방향 계보는 한 보고서를 읽는 사람에게 그 줄이 어디서 왔는지 알려 준다. 이것은
        반대 방향이다 — 페이지·덱·커밋의 주인이 **무엇이 그 위에 세워졌는지** 알아내는
        길이며, 그 사람은 대개 가장 늦게 알고, 바꾸기 전에 가장 알아야 하는 사람이다.

        `kind`와 `reference`를 함께 지정한다. 둘 중 하나가 없으면 400이다.

        **조회 범위 안의 인용만 나열한다.** 범위 밖 보고가 같은 근거를 쓰고 있어도
        이름은 나오지 않는다. `total`도 같은 범위 안의 수다.

        최대 50건.
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [MANUAL, CONFLUENCE, PPTX, AI_TEXT, JIRA, GIT, CI, ITSM, API] } }
        - { name: reference, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /work-items/{id}/links:
    get:
      summary: 업무의 선행·후행 관계
      description: |
        `blockers`는 이 업무가 기다리는 것, `blocking`은 이 업무를 기다리는 것이다.
        **저장되는 것은 방향 있는 간선 하나뿐**이다. "A가 B를 기다린다"와 "B가 A를
        막는다"는 같은 사실을 양끝에서 본 것이므로, 두 종류로 저장하면 둘이 어긋날 수
        있고 스스로 모순되는 그래프는 없느니만 못하다.

        각 항목은 상대 업무의 담당자·조직·최근 보고 주차·진척을 담는다. `ready`는
        선행 업무가 100%에 도달했는지다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: 선행 업무 등록
      description: |
        `blockerId`가 먼저 끝나야 이 업무가 진행된다고 선언한다. **본인 업무에 대해서만**
        등록할 수 있다 — 자기 일이 무엇을 기다리는지에 대한 진술이기 때문이다.

        **상대의 동의를 받지 않는다.** 상대 조직이 동의해야 하는 의존은 아무도 기록하지
        않는 의존이다. 대신 `note`에 사유를 남기고, 상대는 자기 화면에서 그것을 보고
        이의를 제기하거나 관계를 삭제할 수 있다.

        선행 업무는 **조회 범위 밖이어도 된다.** 다른 조직의 업무를 기다리는 것이 이
        기능이 존재하는 이유다.

        **순환이 되면 409 `DEPENDENCY_CYCLE`이며, 어떤 사슬이 순환을 만드는지 제목으로
        함께 알려 준다.** 보이지 않는 그래프를 두고 추측하게 두지 않기 위해서다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /work-item-links/{linkId}:
    delete:
      summary: 선행 관계 삭제
      description: |
        **양쪽 담당자 모두 삭제할 수 있다.** 기다리는 쪽은 자기가 선언했으니, 막는 쪽은
        사실이 아닌 의존이 자기 업무에 붙어 있는 것을 상대 동의 없이 떼어낼 수 있어야
        하기 때문이다.
      parameters:
        - { name: linkId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 삭제 완료 }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /work-items/{id}/decisions:
    get:
      summary: 업무의 결정 기록
      description: |
        결정 일자 내림차순. 각 항목은 title, decidedBy, decidedOn, rationale, followUp,
        dueDate, status(OPEN·DONE·SUPERSEDED), supersedesId, recordedByName을 담는다.

        **decidedBy와 recordedByName은 다르다.** 팀장이 임원 결정을 대신 적는 경우가
        흔하므로 둘을 합치면 이 기록이 가장 필요한 상황에서 틀린 값을 갖게 된다.

        조회 범위는 업무 주인을 볼 수 있는지로 정한다. 인수인계와 같은 규칙이다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: 결정 기록
      description: |
        title과 decidedBy는 필수다. 없으면 "무언가 정해졌다"는 사실만 남고 읽는 사람이
        아무것도 할 수 없다. decidedOn은 `YYYY-MM-DD`이며 dueDate는 그보다 빠를 수 없다.

        supersedesId를 주면 **같은 업무의** 결정만 가리킬 수 있고, 그 결정은
        SUPERSEDED로 바뀐다. 지우지 않는다 — 뒤집힌 결정은 없던 결정보다 정보가 많다.

        기록은 업무를 **볼 수 있는 사람**이면 할 수 있다. 업무 병합·분리와 다른 규칙인데,
        병합은 남의 보고 이력을 고쳐 쓰는 일이고 기록은 덧붙이는 일이기 때문이다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /work-items/{id}/decisions/suggest:
    post:
      summary: 보고 내용에서 결정 후보 제안, AI Gateway 필요
      description: |
        그 업무의 주차별 보고 본문(실적·계획·이슈·상위 조직 요청)을 읽어 결정 후보를
        **제안만** 한다. **아무것도 저장하지 않는다.** 후보는 사람이 고쳐서 확정할
        양식일 뿐이다.

        응답의 `caveat`는 화면이 반드시 함께 보여 줘야 하는 문장이며 그래서 payload에
        담아 보낸다. **여기 없다고 해서 결정이 없었다는 뜻이 아니다.** 로드맵이 못 박은
        원칙이다 — 감사·기억 시스템의 신뢰도를 모델 재현율에 의존시키지 않는다.

        각 후보는 confidence와 함께 근거가 된 보고 원문(`evidence`)을 담는다. 확정하는
        사람이 모델이 아니라 기록에 대고 확인할 수 있어야 하기 때문이다. 모델이 지어낸
        날짜는 서버가 비운다 — 없는 날짜가 그럴듯한 날짜보다 낫다.

        최대 5건. AI Gateway가 꺼져 있으면 503이고, 화면은 버튼 자체를 띄우지 않는다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /decisions/open:
    get:
      summary: 본인 업무의 미해결 후속 조치
      description: |
        상태가 OPEN이고 후속 조치가 비어 있지 않은 결정을, 그 결정이 달린 업무 제목과
        함께 반환한다. 기한이 빠른 순, 없으면 결정일 최신 순. `overdue`는 기한이 오늘을
        지났는지다.

        **본인 업무만이다.** 후속 조치는 해야 할 일이고, 남의 의무 목록은 할 일 목록이
        아니다.

        회의의 되돌려 쓰기 절반이다. 회의가 정하고 결정이 기록되지만, 이것이 없으면
        기록은 거기서 멈춘다 — 다음 월요일에 작성자는 자기가 무엇에 합의했는지 아무 표시도
        없는 빈 편집기를 연다. 작성 화면이 지난주 계획을 돌려주는 바로 그 자리에서 이것도
        함께 돌려준다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /decisions/{id}:
    patch:
      summary: 결정 기록 수정
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: 결정 기록 삭제, 기록한 사람과 관리자만
      description: |
        잘못 적은 기록을 지우기 위한 것이지, 남기고 싶지 않은 기록을 지우기 위한 것이
        아니다. 다른 사람이 조용히 고칠 수 있는 기록은 기록이 아니므로, 볼 수 있는 사람
        전부가 아니라 **기록한 사람과 관리자만** 지울 수 있다.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: 삭제 완료 }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /handover:
    get:
      summary: 담당자 인수인계 자료
      description: |
        주차 스냅샷에서 진행 경과, 이슈 이력과 해소 여부, 미해결 요청, 관련 업무를 모은다.
        진행 경과는 진척이 실제로 변한 주차만 남긴다.

        userId를 생략하면 본인 자료를 반환한다. 다른 담당자를 조회하려면 팀장 이상이면서
        **그 담당자가 조회 범위 안에** 있어야 한다. 범위 밖이면 403이다.

        이전에는 역할만 확인했다. 업무는 범위대로 걸러졌지만 이름은 사용자 표에서 그대로
        채워 넣어, 팀장이 식별자를 훑어 전사 이름을 읽을 수 있었다. 그리고 범위 밖 담당자가
        평범한 빈 인수인계로 돌아와서, 열어 볼 수 없는 사람과 맡은 일이 없는 사람이
        구분되지 않았다.

        여기서 허용하는 대상은 `/team/members`가 제안하는 사람과 정확히 같다.

        track은 보고된 주차마다 week, progress, issue를 담는다. firstWeek와 lastWeek
        사이인데 track에 없는 주차가 **보고가 누락된 주차**이며, 화면은 그 빈칸을
        그린다. milestones는 진척이 변한 주차만 남기므로 빈 구간을 표현할 수 없다.

        decisions는 그 업무의 결정 기록 전부다. 잘라 내지 않는다 — 인수인계가 존재하는
        이유가 "아무도 기억하지 못하는 것"이고, 그 기록을 잘라 내면 화면의 존재 이유가
        사라진다. 결정은 사람이 결정을 내리는 속도로 쌓이므로 원래 작은 목록이다.

        openDecisions는 후속 조치가 남은 결정 수, overdueDecisions는 그중 기한이 지난
        수다. 기한이 지난 후속 조치가 있으면 해당 업무의 caution이 그것으로 바뀐다.
        다른 주의 문구는 기록이 무엇을 보여 주는지를 말하지만, 이것은 **누군가 약속하고
        지키지 않은 것**을 지목한다.

        relatedWork는 업무마다 **최대 5건**이다. 이전에는 조직 전체의 모든 쌍을 비교한
        결과에서 대상자 것만 골라 담았고, 업무 15건짜리 자료에 관련 업무 3,915건이 실렸다.
        이제 대상자의 업무에 닿는 쌍만 비교한다.
      parameters:
        - { name: userId, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /work-items/lookup:
    get:
      summary: 선행 업무로 지정할 대상 찾기
      description: |
        선행 관계를 선언하는 것은 **남의 업무를 가리키는 일**이고, 찾을 수 없는 것은 가리킬 수도
        없다. `/work-items/search` 는 다른 질문("전에 이런 걸 다뤄 본 사람이 있나")에 답하느라
        이슈·해결·판단 근거 본문을 함께 싣는데, 그것은 선언에 필요한 것보다 많고 모두가 볼 것보다도
        많다. 그래서 이 경로는 선언이 화면에 표시할 네 가지만 돌려준다 — 업무 식별자·제목·담당자·조직.

        범위는 **배포 전체**다. 한 팀 안의 의존은 그 안의 두 사람이 정리하고, 기록할 가치가 있는
        것은 조직을 가로지르는 쪽인데 호출자의 조직으로 제한하면 바로 그것들이 빠진다. 대가로
        로그인한 누구나 그런 제목의 업무가 있고 누가 맡고 있는지 알 수 있게 된다. 선언이 어차피
        화면에 내보이는 것과 같은 정보이므로 이 조회가 새로 드러내는 것은 없지만, 노출이 넓어지는
        변경이므로 운영자가 알고 있어야 한다.

        두 글자부터 답한다. 한국어 업무 제목은 짧고, 검색이 두 글자에 침묵하면 선행 업무를 지정할
        길이 사라진다. 한 글자에는 답하지 않는다 — 매 타건마다 배포 전체의 제목을 훑게 된다.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /work-items/search:
    get:
      summary: 자연어 과거 업무·사례 검색
      description: |
        업무의 전체 이력(제목, 구분, 실적, 계획, 이슈, 요청)에서 찾는다. 이슈가 사라진
        다음 주의 실적을 resolution으로 함께 반환해 해결 경과를 확인할 수 있게 한다.

        pgvector와 임베딩 모델이 설정돼 있으면 표현이 다른 업무도 함께 찾으며 해당 결과의
        semantic이 true가 된다. 확장이 없으면 문자열 일치만 사용한다.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [SELF, TEAM], default: SELF } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/embeddings:
    get:
      summary: 의미 검색 임베딩 현황, 관리자 전용
      description: |
        pgvector 설치 여부, 의미 검색 활성 여부, 임베딩이 생성된 항목 수를 반환한다.
        stale은 임베딩을 만든 뒤 본문이 수정되어 갱신을 기다리는 항목 수다. 검색은 되지만
        지금은 존재하지 않는 문장으로 답하므로 별도로 센다.
        비활성 상태이면 reason에 사유를 담는다. 코사인 점수 범위는 임베딩 모델마다
        다르므로 search.semantic_threshold를 조정할 때 이 값을 기준으로 삼는다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/embeddings/rebuild:
    post:
      summary: 임베딩 일괄 생성, 관리자 전용
      description: |
        임베딩이 없거나 임베딩을 만든 뒤 본문이 수정된 보고 항목을 임베딩한다.
        배경 작업이 다음 주기를 기다리지 않고 즉시 채운다.
        같은 모델로 임베딩됐고 그 뒤 수정되지 않은 항목은 다시 만들지 않는다.
        요청 하나는 끝나야 하므로 한 번에 최대 200배치(6,400건)까지만 처리하고,
        남은 건수를 `remaining` 으로 돌려준다. 나머지는 배경 작업이 이어서 처리한다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/analytics/keywords:
    get:
      summary: 보고 내용 키워드 분석, 관리자 전용
      description: |
        보고서 한 건을 문서 하나로 보고 용어를 추출한다. 어미와 조사를 규칙으로 제거하되
        명사의 마지막 글자일 수 있는 조사는 어근이 말뭉치에 관찰될 때만 제거하며,
        인접한 두 단어를 복합어로 함께 집계한다. 가중치는 로그 빈도에 역문서빈도를 곱한 값이다.
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
        - { name: field, in: query, schema: { type: string, enum: [ALL, TITLE, CURRENT, NEXT, ISSUE], default: ALL } }
        - { name: organizationId, in: query, description: 하위 조직 포함, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/analytics/organizations:
    get:
      summary: 조직별 제출률·완료율·이슈율 비교, 관리자 전용
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/analytics/participation:
    get:
      description: |
        제출률과 정시 제출률, 미제출 현황을 반환한다. 응답의 deadline이 정시 판정 기준이며,
        화면은 이 값을 그대로 표시한다. 정의가 보이지 않는 정시율은 저마다 다른 기준을 가정하게 만든다.

        판정은 `주차 시작일 + workflow.deadline_days일 + workflow.deadline_hour시`를 service.timezone으로
        해석한 시각과 submitted_at을 비교한다. v0.18.0 이전에는 submitted_at을 데이터베이스 세션
        시간대(UTC)로 날짜 변환해 비교했고, 그 결과 마감 다음 날 오전에 낸 보고서가 정시로 집계됐다.
      summary: 주차별 제출률·기한 내 제출률과 미제출 인원, 관리자 전용
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 104, default: 12 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/audit:
    get:
      summary: 감사 이력 조회, 관리자 전용
      description: |
        감사 이력을 조건으로 조회한다. 이전에는 최근 500건을 조건 없이 반환할 뿐이어서,
        수백 명 규모에서는 며칠이면 "누가 언제 이 보고서를 승인했는지"를 답할 수 없게 됐다.

        action은 앞부분 일치이므로 `report`로 보고서 관련 작업을 모두 찾을 수 있다.
        actor는 아이디와 표시 이름 모두에 부분 일치한다. total을 함께 반환하므로 화면이
        보여 주는 것이 전부인 것처럼 오해할 여지가 없다. limit 상한은 200이다.

        `audit.retention_days`가 지난 기록은 유지보수 주기에 삭제한다. 0이면 지우지 않는다.
      parameters:
        - { name: action, in: query, schema: { type: string }, description: 앞부분 일치 }
        - { name: actor, in: query, schema: { type: string }, description: 아이디 또는 이름 부분 일치 }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date }, description: 그날을 포함 }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: 감사 이력 한 쪽
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { type: object } }
                          total: { type: integer }
                          limit: { type: integer }
                          offset: { type: integer }
                          retentionDays: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /admin/settings/oidc/test:
    post:
      summary: OIDC 설정 연결 시험
      description: |
        저장된 OIDC 설정으로 식별 공급자에 실제로 닿아 본다. 설정을 저장한 뒤 로그인
        화면에서 처음 확인하게 되면, 그때는 이미 아무도 못 들어오는 상태다.
      tags: [Admin]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { description: 설정이 없거나 공급자에 닿지 못했다 }
  /admin/settings:
    get:
      summary: 운영 설정 조회
      responses:
        "200": { $ref: "#/components/responses/Success" }
    put:
      summary: 운영 설정 변경
      description: |
        결과를 되돌리기 어려운 설정은 확인을 요구한다. `workflow.week_start`를 바꿀 때
        기존 보고서가 새 주차 격자에서 벗어나면 409 `WEEK_START_NEEDS_CONFIRMATION`과 함께
        영향 범위를 반환하고, 같은 요청에 `confirmed: ["workflow.week_start"]`를 넣어야 진행한다.

        격자를 옮기면 벗어난 보고서는 참여 분석에서 빠지고, 기간 보고에서 한 주가 두 주로
        집계될 수 있다. 전환 주에는 기존 보고서와 기간이 겹쳐 새 보고서를 만들 수 없으므로
        작성자는 기존 보고서를 열어 이어 써야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: { type: string } }
                confirmed: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/settings/ai/test:
    post:
      summary: 저장된 AI Gateway 설정의 Structured Output 연결 시험
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/settings/confluence/test:
    post:
      summary: 저장된 Confluence 6.9.1 REST 설정 연결 시험
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "502": { $ref: "#/components/responses/Error" }
  /admin/confluence/sync:
    post:
      summary: 관리자 증분 동기화 비동기 요청
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/confluence/sync/status:
    get:
      summary: 동기화 상태·처리 건수·최근 오류
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/confluence/users/mappings:
    get:
      summary: Weekly와 Confluence 사용자 매핑·자동 추천 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/confluence/users/unmapped:
    get:
      summary: 활성 미매핑 사용자 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /admin/confluence/users/{id}/mapping:
    put:
      summary: 관리자 명시 Confluence 사용자 매핑
      parameters:
        - { $ref: "#/components/parameters/ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalUsername, active]
              properties:
                externalUsername: { type: string, minLength: 1, maxLength: 255 }
                active: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/encryption:
    get:
      summary: 비밀 설정 암호화 키 상태
      description: |
        이 배포가 상태 볼륨을 잃으면 비밀 설정을 복구할 수 있는지 답한다.

        `keySource` 가 `environment` 면 키가 `WEEKLY_ENCRYPTION_KEY` 에 있으므로 볼륨과
        무관하게 복구된다. `state_volume` 이면 키의 유일한 사본이 볼륨 안 `instance.key`
        이며, 저장된 비밀 설정이 하나라도 있으면 볼륨을 잃는 순간 함께 잃는다.

        `storedSecrets` 는 요청 시점에 센다. 오늘 오후에 넣은 키가 바로 지금 위험한
        것이기 때문에, 기동 시점의 값을 들고 있으면 답이 틀린다.

        이 답은 원래 기동 로그 한 줄에만 있었다. 배포를 물려받은 사람이 몇 달 뒤에
        묻는 질문인데, 그때 그 줄은 남아 있지 않다. README 는 이 구별이 백업 절차를
        가른다고 적어 두고 있다.
      tags: [Admin]
      responses:
        '200':
          description: 키 출처와 위험 여부
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      keySource: { type: string, enum: [environment, state_volume] }
                      storedSecrets: { type: integer }
                      recoverable: { type: boolean, description: 볼륨을 잃어도 비밀 설정을 복구할 수 있는가 }
                      stateDirectory: { type: string }
        '403': { description: 관리자만 조회할 수 있다 }
  /admin/users:
    get:
      summary: 사용자 목록 (검색·페이지)
      description: |
        `items`·`total`·`limit`·`offset` 을 반환한다. 전량을 돌려주던 시절에는 300명에
        63KB였고 1만 명이면 메가바이트 단위가 되며, 특정 계정을 찾을 방법은 브라우저의
        페이지 내 찾기뿐이었다. 그래서 **상한과 검색을 함께** 넣었다. 찾을 방법 없는 상한은
        무제한보다 나쁘다 — 필요한 계정이 그냥 사라지기 때문이다.

        `q` 는 로그인 아이디·표시 이름·이메일을 함께 본다. 관리자는 셋 중 무엇을 들고
        올지 모르기 때문이다.

        `unassigned` 는 소속 조직이 지정되지 않은 계정의 **전체 개수**이며 `q`·`role`·
        `organization` 과 무관하다. 그 계정의 주간보고는 어느 팀장에게도 보이지 않아
        결재를 쓰는 곳에서는 제출해도 검토 대기 상태로 남는데, 관리자에게는 그런 계정이
        있다는 사실을 알 방법이 없었다 — 빈 칸을 찾아 전원을 넘겨 보는 것 말고는.

        `role` 은 쉼표로 구분한 역할 목록이다. 검토 책임자 선택기가 이것을 쓴다. 표의 한
        페이지에서 만들면 조직이 커질수록 검토자가 조용히 목록에서 빠지고, 보는 사람은
        그 이름이 자격이 없어서 없는 것인지 페이지 밖이라서 없는 것인지 알 수 없다.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 아이디·이름·이메일 부분 일치 }
        - { name: organization, in: query, schema: { type: string, enum: [none] }, description: "none 이면 소속 조직이 지정되지 않은 계정만 반환한다. 인식하지 못한 값은 무시한다 — 오타가 목록을 조용히 비우면 배포에 계정이 없다고 읽게 된다." }
        - { name: role, in: query, schema: { type: string }, description: "쉼표 구분, 예: TEAM_LEADER,ORG_MANAGER,ADMIN" }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: 사용자 등록
      responses:
        "201": { $ref: "#/components/responses/Success" }
  /admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: 사용자 수정
      description: |
        **보낸 것으로 바꾸는 것이 아니라, 보낸 것이 전부가 된다.** `organizationId`,
        `managerId` 처럼 생략한 항목은 유지되지 않고 **비워진다**. PUT 의 의미이지만
        결과가 조용해서 위험하다 — 표시 이름만 고치려고 그 두 필드를 빼고 보내면 그
        사람의 소속과 검토 책임자가 사라지고, 아무 오류도 나지 않는다.

        소속이 사라진 팀장·조직장은 `GET /team/reports` 에서 **빈 목록**을 받는다.
        조직원이 아무도 쓰지 않은 것과 화면이 같아지므로, 그 응답은 `notice` 에 소속이
        지정되어 있지 않다는 사실을 담는다.

        `password` 는 보냈을 때만 바뀐다. 생략하면 기존 비밀번호가 유지된다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/organizations:
    get:
      summary: 조직 목록
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: 조직 등록
      responses:
        "201": { $ref: "#/components/responses/Success" }
  /admin/pptx-template:
    parameters:
      - name: organizationId
        in: query
        required: false
        schema: { type: integer, format: int64 }
        description: >-
          템플릿을 적용할 조직. 생략하면 전사 기본 템플릿을 가리킵니다.
          보고서는 작성자가 속한 조직의 템플릿으로 내보내며, 전용 템플릿이 없으면
          가장 가까운 상위 조직의 템플릿을, 그것도 없으면 전사 기본을 사용합니다.
    get:
      summary: PPTX 템플릿 정보
      description: >-
        조직을 지정하면 그 조직에 실제로 적용되는 템플릿을 반환합니다.
        source 가 inherited 이면 inheritedFrom 이 물려받은 조직 이름입니다.
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: PPTX 템플릿 업로드
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    delete:
      summary: 기본 PPTX 템플릿 복원
      responses:
        "200": { $ref: "#/components/responses/Success" }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: weekly_session }
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ID: { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
  responses:
    Success:
      description: 성공
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
  schemas:
    Envelope:
      type: object
      required: [success, traceId]
      properties:
        success: { type: boolean }
        data: {}
        error:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }
        traceId: { type: string }
    ReportStatus:
      type: string
      enum: [DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, CLOSED]
    ReportItem:
      type: object
      required: [title, currentResult, nextPlan, issue, progress]
      properties:
        category: { type: string }
        title: { type: string, maxLength: 240 }
        currentResult: { type: string }
        nextPlan: { type: string }
        issue: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
    AIReportItem:
      allOf:
        - { $ref: "#/components/schemas/ReportItem" }
        - type: object
          required: [confidence]
          properties:
            confidence: { type: number, minimum: 0, maximum: 1 }
            categoryConfidence:
              type: number
              minimum: 0
              maximum: 1
              description: 업무 구분 판정 신뢰도. 기존 저장 결과에는 없을 수 있다.
            sourceSlides:
              type: array
              uniqueItems: true
              description: PPTX 분석 항목의 근거가 확인된 표시 순서 슬라이드 번호. 자유 텍스트 분석은 빈 배열이며 기존 저장 결과에는 없을 수 있다.
              items: { type: integer, minimum: 1 }
    AIWeeklyResult:
      type: object
      required: [summary, weekStart, dateConfidence, reportItems, warnings]
      properties:
        summary: { type: string }
        weekStart: { type: string, description: 명확하지 않으면 빈 문자열 }
        dateConfidence: { type: number, minimum: 0, maximum: 1 }
        reportItems:
          type: array
          items: { $ref: "#/components/schemas/AIReportItem" }
        warnings:
          type: array
          items: { type: string }
    ImportFile:
      type: object
      required: [id, originalFilename, fileHash, sizeBytes, status]
      properties:
        id: { type: integer, format: int64 }
        originalFilename: { type: string }
        fileHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        sizeBytes: { type: integer, format: int64 }
        status:
          type: string
          enum: [QUEUED, PROCESSING, READY, NEEDS_REVIEW, FAILED, DUPLICATE, CONFIRMED, SKIPPED]
        detectedWeekStart: { type: string }
        detectedWeekEnd: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        dateSource: { type: string }
        result: { $ref: "#/components/schemas/AIWeeklyResult" }
        errorMessage: { type: string }
        duplicateOf: { type: integer, format: int64 }
        reportId: { type: integer, format: int64 }
        conflictReportId: { type: integer, format: int64 }
    ImportJob:
      type: object
      required: [id, status, totalFiles, processedFiles, failedFiles, createdAt]
      properties:
        id: { type: integer, format: int64 }
        status:
          type: string
          enum: [PENDING, PROCESSING, READY, PARTIAL, FAILED, CONFIRMED, NOTHING_TO_IMPORT]
        totalFiles: { type: integer }
        processedFiles: { type: integer }
        failedFiles: { type: integer }
        createdAt: { type: string, format: date-time }
        files:
          type: array
          items: { $ref: "#/components/schemas/ImportFile" }
    ImportConfirmFile:
      type: object
      required: [id, weekStart, strategy, items]
      properties:
        id: { type: integer, format: int64 }
        weekStart: { type: string, format: date }
        summary: { type: string }
        strategy: { type: string, enum: [CREATE, MERGE, REPLACE, SKIP] }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ImportConfirmItem" }
    ImportConfirmItem:
      type: object
      additionalProperties: false
      required: [category, title, currentResult, nextPlan, issue, progress]
      properties:
        category: { type: string, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 240 }
        currentResult: { type: string }
        nextPlan: { type: string }
        issue: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 1, description: 미리보기 표시용 값이며 확정 보고서에는 저장하지 않음 }
    ConfluenceSource:
      type: object
      required: [pageId, title, spaceKey, pageUrl, pageVersion, activityType]
      properties:
        pageId: { type: string }
        title: { type: string }
        spaceKey: { type: string }
        pageUrl: { type: string, format: uri }
        pageVersion: { type: integer }
        activityType: { type: string, enum: [CREATED, MODIFIED, CREATED_AND_MODIFIED] }
        sourceUpdatedAt: { type: string, format: date-time }
    ConfluenceCandidateWrite:
      type: object
      required: [normalizedTitle, category, currentResult, nextPlan, issue]
      properties:
        normalizedTitle: { type: string, minLength: 1, maxLength: 240 }
        category: { type: string, maxLength: 80 }
        currentResult: { type: string }
        nextPlan: { type: string }
        issue: { type: string }
    ConfluenceCandidate:
      allOf:
        - { $ref: "#/components/schemas/ConfluenceCandidateWrite" }
        - type: object
          required: [id, weekStart, confidence, ruleScore, status, userEdited, sources]
          properties:
            id: { type: integer, format: int64 }
            weekStart: { type: string, format: date }
            confidence: { type: number, minimum: 0, maximum: 1 }
            ruleScore: { type: integer }
            status: { type: string, enum: [DETECTED, ACCEPTED, IGNORED, MERGED, REMOVED] }
            userEdited: { type: boolean }
            sources:
              type: array
              items: { $ref: "#/components/schemas/ConfluenceSource" }
    ReportWrite:
      type: object
      required: [summary, items]
      properties:
        weekStart: { type: string, format: date }
        summary: { type: string, maxLength: 10000 }
        version: { type: integer, minimum: 1 }
        sourceType: { type: string, enum: [MANUAL, AI_TEXT, CONFLUENCE_AI] }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ReportItem" }
