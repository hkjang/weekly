<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="weekly-intense-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="wk-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Completely Transparent Background (No Rectangle Frame) -->
  <g filter="url(#wk-glow)">
    <!-- Sharp Octagonal Edge Progress Ring -->
    <polygon points="36,10 84,10 110,36 110,84 84,110 36,110 10,84 10,36" 
             fill="none" 
             stroke="url(#weekly-intense-grad)" 
             stroke-width="4" 
             stroke-dasharray="14 6" 
             stroke-linecap="round" />
    
    <!-- Bold Sharp Edge W Monogram -->
    <path d="M 22 36 L 40 88 L 60 52 L 80 88 L 98 36" 
          fill="none" 
          stroke="url(#weekly-intense-grad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Pulse Node -->
    <circle cx="60" cy="52" r="7" fill="#ffffff" filter="url(#wk-glow)" />
    <circle cx="98" cy="36" r="5" fill="#3b82f6" />
    <circle cx="22" cy="36" r="5" fill="#10b981" />
  </g>
</svg>
